  state.liveReasoning = '';
  state.liveReasoningActive = false;
  state.status = { type: 'connected', label: '已连接' };
  bump();
}

/* ── Re-render system (simple pub/sub) ─────────────────────────── */
let _version = 0;
const _listeners = new Set();
function bump() { _version++; _listeners.forEach(fn => fn(_version)); }
function useBump() {
  const [, setV] = useState(_version);
  useEffect(() => { const fn = v => setV(v); _listeners.add(fn); return () => _listeners.delete(fn); }, []);
}

/* ── Streaming event bus (for incremental DOM updates) ────────── */
const streamBus = new EventTarget();

/* ═══════════════════════════════════════════════════════════════════
   Utility Functions
   ═══════════════════════════════════════════════════════════════════ */
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return [...(root || document).querySelectorAll(sel)]; }

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function generateId() {
  return 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

function simpleHash(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + c;
    hash = hash & hash;
  }
  return 'h' + Math.abs(hash).toString(36);
}

function renderMarkdown(text) {
  if (!text) return '';
  try {
    let html = text;
    if (typeof marked !== 'undefined' && marked.parse) {
      html = marked.parse(text, { breaks: true, gfm: true });
    }
    if (typeof DOMPurify !== 'undefined' && DOMPurify.sanitize) {
      html = DOMPurify.sanitize(html, {
        ADD_ATTR: ['target'],
        ALLOWED_TAGS: ['p','br','b','i','strong','em','a','ul','ol','li',
          'h1','h2','h3','h4','h5','h6','code','pre','blockquote',
          'hr','table','thead','tbody','tr','th','td',
          'span','div','del','ins','sup','sub','dl','dt','dd'],
      });
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      tmp.querySelectorAll('a[target="_blank"]').forEach(a => {
        if (!a.getAttribute('rel')?.includes('noopener')) a.setAttribute('rel', 'noopener noreferrer');
      });
      tmp.querySelectorAll('pre').forEach(pre => {
        if (!pre.querySelector('.code-copy-btn')) {
          const btn = document.createElement('button');
          btn.className = 'code-copy-btn';
          btn.innerHTML = ICONS.copy + '<span>复制</span>';
          btn.addEventListener('click', () => {
            const code = pre.querySelector('code');
            if (code) { navigator.clipboard.writeText(code.textContent); btn.querySelector('span').textContent = '已复制'; setTimeout(() => btn.querySelector('span').textContent = '复制', 1500); }
          });
          pre.classList.add('code-block-wrapper');
          pre.appendChild(btn);
        }
      });
      html = tmp.innerHTML;
    }
    return html;
  } catch (e) {
    return escapeHtml(text);
  }
}

function timeAgo(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小时前';
  const d = Math.floor(h / 24);
  if (d < 7) return d + ' 天前';
  return new Date(ts).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
}

/* ═══════════════════════════════════════════════════════════════════
   API Helpers
   ═══════════════════════════════════════════════════════════════════ */
function getToken() { return state.token; }

async function apiFetch(path, options = {}) {
  const separator = path.includes('?') ? '&' : '?';
  const dir = options.skipDirectory ? null : (options.directory || _currentDirectory);
  const url = dir ? (path + separator + 'directory=' + encodeURIComponent(dir)) : path;
  const headers = { 'X-Auth-Token': getToken(), ...(options.headers || {}) };
  if (options.body && !options.bodyFormatted) headers['Content-Type'] = 'application/json';
  const res = await fetch(url, {
    method: options.method || 'GET',
    headers, body: options.body || undefined,
    signal: options.signal || undefined,
  });
  if (!res.ok) {
    if (res.status === 401) { sessionStorage.removeItem('ocr_token'); location.reload(); }
    let errMsg = '';
    try { errMsg = await res.text(); } catch (e) { errMsg = res.statusText; }
    const err = new Error(errMsg || 'HTTP ' + res.status);
    err.status = res.status;
    throw err;
  }
  return res;
}

function apiJson(path, options = {}) {
  return apiFetch(path, options).then(r => r.json());
}

/* ═══════════════════════════════════════════════════════════════════
   Storage Helpers
   ═══════════════════════════════════════════════════════════════════ */
function saveStorage() {
  try {
    const data = {
      sessions: state.sessions.map(s => ({
        id: s.id, slug: s.slug, title: s.title,
        directory: s.directory,
        messages: s.messages, createdAt: s.createdAt, lastActiveAt: s.lastActiveAt,
      })),
      currentSessionId: state.currentSessionId,
      currentDirectory: _currentDirectory,
    };
    localStorage.setItem('ocr_state', JSON.stringify(data));
  } catch (e) { /* localStorage may be full */ }
}

function loadStorage() {
  try {
    const raw = localStorage.getItem('ocr_state');
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function saveSessionMessages(sessionId) {
  try {
    const session = state.sessions.find(s => s.id === sessionId);
    if (!session) return;
    const data = JSON.stringify(session.messages);
    // Skip localStorage save if data exceeds 400KB to avoid quota exhaustion
    // (server-side storage is the source of truth anyway)
    if (data.length > 400000) return;
    localStorage.setItem('ocr_msgs_' + sessionId, data);
  } catch (e) { /* storage full */ }
}

function loadSessionMessages(sessionId) {
  try {
    const raw = localStorage.getItem('ocr_msgs_' + sessionId);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

/* ═══════════════════════════════════════════════════════════════════
   SSE Stream Parser
   ═══════════════════════════════════════════════════════════════════ */
async function readSSEFromResponse(response, handlers) {
  if (!response.ok || !response.body) return;
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '', eventType = '', eventData = '';
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      while (buffer.includes('\n')) {
        const nlIdx = buffer.indexOf('\n');
        const line = buffer.slice(0, nlIdx);
        buffer = buffer.slice(nlIdx + 1);
        if (line.startsWith(':')) continue;
        if (line.startsWith('event: ')) eventType = line.slice(7).trim();
        else if (line.startsWith('data: ')) eventData += line.slice(6);
        else if (line === '') {
          if (eventData && handlers) handleSSEEvent(eventType, eventData, handlers);
          eventType = ''; eventData = '';
        }
      }
    }
    if (eventData && handlers) handleSSEEvent(eventType, eventData, handlers);
  } catch (err) { /* stream aborted, ignore */ }
}

function handleSSEEvent(type, data, handlers) {
  let parsed;
  try { parsed = JSON.parse(data); }
  catch (e) { if (handlers.onDelta) handlers.onDelta(data); return; }

  if ((type === 'reasoning_delta' || type === 'reasoning') && handlers.onReasoningDelta) {
    handlers.onReasoningDelta(parsed.content || parsed.text || parsed.delta || '');
  } else if ((type === 'text_delta' || type === 'delta' || type === 'content') && handlers.onDelta) {
    const text = parsed.content || parsed.text || parsed.delta || '';
    if ((parsed.type === 'reasoning' || parsed.type === 'thinking') && handlers.onReasoningDelta) handlers.onReasoningDelta(text);
    else handlers.onDelta(text);
  } else if (type === 'text' && handlers.onDelta) {
    const text = parsed.content || parsed.text || '';
    if ((parsed.type === 'reasoning' || parsed.type === 'thinking') && handlers.onReasoningDelta) handlers.onReasoningDelta(text);
    else handlers.onDelta(text);
  } else if ((type === 'message' || type === 'assistant_message') && handlers.onMessage) {
    handlers.onMessage(parsed.content || parsed.text || '', parsed);
  } else if ((type === 'tool_call' || type === 'tool_use') && handlers.onToolCall) {
    handlers.onToolCall(parsed);
  } else if (type === 'tool_result' && handlers.onToolResult) {
    handlers.onToolResult(parsed);
  } else if ((type === 'done' || type === 'message_done' || type === 'complete') && handlers.onDone) {
    handlers.onDone(parsed);
  } else if (type === 'error' && handlers.onError) {
    handlers.onError(parsed);
  } else if (type === 'question' && handlers.onQuestion) {
    handlers.onQuestion(parsed);
  } else {
    if (parsed.name && handlers.onToolCall) handlers.onToolCall(parsed);
    else if ((parsed.delta || parsed.content) && handlers.onDelta) handlers.onDelta(parsed.delta || parsed.content);
    else if (parsed.role === 'assistant' && handlers.onMessage) handlers.onMessage(parsed.content || '', parsed);
  }
}

/* ═══════════════════════════════════════════════════════════════════
   Session Management
   ═══════════════════════════════════════════════════════════════════ */
function getSession(id) { return state.sessions.find(s => s.id === id); }
function getCurrentSession() { return state.currentSessionId ? getSession(state.currentSessionId) : null; }

async function createSession() {
  const cfg = state.sessionConfig;
  const body = {};
  // Per API-INTERFACES.md §1.3: session creation accepts model (with "id" field, not "modelID"),
  // agent, and variant. These can only be set at creation time.
  if (cfg.model && cfg.model.id) {
    body.model = { id: cfg.model.id, providerID: cfg.model.providerID };
    if (cfg.variant) body.model.variant = cfg.variant;
  }
  if (cfg.agent) body.agent = cfg.agent;
  const opts = { method: 'POST', body: JSON.stringify(body) };
  if (_currentDirectory) opts.directory = _currentDirectory;
  const data = await apiJson('/api/session', opts);
  const session = {
    id: data.id, slug: data.slug || '', title: data.title || 'New session',
    directory: data.directory || _currentDirectory,
    messages: [], createdAt: Date.now(), lastActiveAt: Date.now(),
  };
  store.sessions[data.id] = { id: data.id, slug: data.slug, title: data.title, directory: _currentDirectory };
  store.loadedDirSessions.add(_currentDirectory);
  return session;
}

async function fetchSessions(dir) {
  try {
    const opts = dir ? { directory: dir } : {};
    const data = await apiJson('/api/session', opts);
    return Array.isArray(data) ? data : [];
  } catch { return []; }
}

async function fetchMessages(sessionId) {
  try {
    const data = await apiJson('/api/session/' + encodeURIComponent(sessionId) + '/message');
    return Array.isArray(data) ? data : [];
  } catch { return []; }
}

// Per storage-architecture doc: a message can have multiple parts
// (text, reasoning, tool_call, tool_use, tool_result). The API also
// returns a pre-joined "content" field. We split tool parts into
// separate display messages to preserve full history fidelity.
function convertServerMsgs(serverMsg) {
  const parts = serverMsg.parts || [];
  const info = serverMsg.info || {};
  const ts = info.time?.created || Date.now();
  const role = info.role || 'assistant';
  const textParts = parts.filter(p => p.type === 'text');
  const reasoningParts = parts.filter(p => p.type === 'reasoning');
  const toolParts = parts.filter(p => p.type === 'tool_call' || p.type === 'tool_use' || p.type === 'tool_result');
  const results = [];

  // Tool messages come first (they were executed before the final text reply)
  for (const tp of toolParts) {
    if (tp.type === 'tool_result') {
      // tool_result: append result to the last tool message
      const lastTool = results.length > 0 ? results[results.length - 1] : null;
      if (lastTool && lastTool.role === 'tool') {
        lastTool.content = (lastTool.content ? lastTool.content + '\n' : '') + (tp.content || tp.text || tp.result || JSON.stringify(tp));
      } else {
        results.push({ id: info.id + '_tr', role: 'tool', toolName: 'result', toolArgs: {}, content: tp.content || tp.text || tp.result || JSON.stringify(tp), isStreaming: false, timestamp: ts });
      }
    } else {
      // tool_call / tool_use
      results.push({ id: info.id + '_tc_' + (results.length), role: 'tool', toolName: tp.name || tp.tool || 'tool', toolArgs: tp.arguments || tp.input || tp.args || {}, content: '', isStreaming: false, timestamp: ts });
    }
  }

  // Text + reasoning message
  const text = textParts.map(p => p.text || p.content || '').join('\n');
  const reasoning = reasoningParts.map(p => p.text || p.content || '').join('\n');
  // Use pre-joined "content" field as fallback when parts don't have text
  const finalText = text || serverMsg.content || '';
  const finalReasoning = reasoning || '';

  if (finalText || finalReasoning || role === 'user') {
    results.push({ id: info.id, role, content: finalText, reasoning: finalReasoning, isStreaming: false, timestamp: ts });
  } else if (results.length === 0) {
    // Edge case: no parts but has content field
    results.push({ id: info.id, role, content: serverMsg.content || '', reasoning: '', isStreaming: false, timestamp: ts });
  }

  return results;
}

function mergeBackendMessages(session, serverMsgs) {
  const localIds = new Set(session.messages.map(m => m.id));
  const converted = [];
  for (const sm of serverMsgs) {
    const msgs = convertServerMsgs(sm);
    for (const m of msgs) {
      if (!localIds.has(m.id) && (m.content || m.reasoning || m.role === 'tool')) {
        converted.push(m);
        localIds.add(m.id);
      }
    }
  }
  if (converted.length > 0) {
    // Append at end — backend messages are older history, local messages are newer
    session.messages = [...session.messages, ...converted];
  }
}

function mergeBackendSessions(backendSessions) {
  for (const s of backendSessions) {
    // Per storage-architecture doc: session list returns {id, slug, title, directory, time}
    // Store directory so sessions can be grouped by working directory
    const existing = state.sessions.find(x => x.id === s.id);
    if (!existing) {
      state.sessions.push({
        id: s.id, slug: s.slug || '', title: s.title || '会话',
        directory: s.directory || '',
        messages: [], createdAt: s.time?.created || Date.now(),
        lastActiveAt: s.time?.updated || Date.now(),
      });
    } else {
      existing.title = s.title || existing.title;
      existing.directory = s.directory || existing.directory || '';
      existing.lastActiveAt = s.time?.updated || existing.lastActiveAt;
    }
  }
}

async function ensureSession() {
  // 0. Check persistent store first
  if (store.loadedDirSessions.has(_currentDirectory)) {
    const dirSessions = Object.values(store.sessions)
      .filter(s => s.directory === _currentDirectory || s.directory?.endsWith('\\' + _currentDirectory.split('\\').pop()));
    if (dirSessions.length > 0) {
      state.sessions = dirSessions.map(s => ({
        id: s.id, slug: s.slug || '', title: s.title || '会话',
        directory: s.directory || _currentDirectory,
        messages: store.messages[s.id] || [],
        createdAt: s.createdAt || s.time?.created || Date.now(),
        lastActiveAt: s.lastActiveAt || s.time?.updated || Date.now(),
      }));
      state.currentSessionId = state.sessions[0]?.id || null;
      const cur = getCurrentSession();
      if (cur && store.messages[cur.id] && store.messages[cur.id].length > 0) {
        cur.messages = store.messages[cur.id];
        bump(); return;
      }
    }
  }
  // 1. Restore from localStorage
  const stored = loadStorage();
  if (stored && stored.sessions && stored.sessions.length > 0) {
    state.sessions = stored.sessions;
    state.currentSessionId = stored.currentSessionId || stored.sessions[0].id;
  }
  // 2. Fetch backend sessions and merge
  const backendSessions = await fetchSessions(_currentDirectory);
  if (backendSessions.length > 0) {
    mergeBackendSessions(backendSessions);
    if (!state.currentSessionId) state.currentSessionId = state.sessions[0]?.id;
    backendSessions.forEach(s => { store.sessions[s.id] = s; });
    store.loadedDirSessions.add(_currentDirectory);
  }
  // 3. Load local-cached messages, then fetch backend messages
  const cur = getCurrentSession();
  if (cur) {
    const saved = loadSessionMessages(cur.id);
    if (saved.length > 0) cur.messages = saved;
    const serverMsgs = await fetchMessages(cur.id);
    if (serverMsgs.length > 0) {
      mergeBackendMessages(cur, serverMsgs);
      saveSessionMessages(cur.id);
      store.messages[cur.id] = [...cur.messages];
      store.loadedMessages.add(cur.id);
    }
  }
  // 4. Render if we have sessions
  if (state.sessions.length > 0) { bump(); return; }
  // 5. Create one
  let session;
  try { session = await createSession(); }
  catch (err) { state.status = { type: 'error', label: '不可用' }; bump(); throw err; }
  state.sessions.push(session);
  state.currentSessionId = session.id;
  saveStorage();
  bump();
}

// Abort active stream and finalize the streaming message in the current session.
// Must be called BEFORE changing currentSessionId, because finalizeAssistantMessage
// relies on getCurrentSession() to locate the message.
function abortActiveStream() {
  // 1. Abort the fetch so SSE handlers stop firing
  if (_sendAbortController) {
    try { _sendAbortController.abort(); } catch (e) { /* already aborted */ }
    _sendAbortController = null;
  }
  // 2. Finalize the streaming message in the OLD session (before switch)
  if (state.currentStreamMsgId) {
    const oldSession = getCurrentSession();
    if (oldSession) {
      const msg = oldSession.messages.find(m => m.id === state.currentStreamMsgId);
      if (msg) {
        if (msg._raf) { cancelAnimationFrame(msg._raf); msg._raf = null; }
        if (msg._saveTimer) { clearTimeout(msg._saveTimer); msg._saveTimer = null; }
        msg.isStreaming = false;
        msg._contentHash = simpleHash(msg.content);
        // Dispatch final stream event so the DOM updates
        streamBus.dispatchEvent(new CustomEvent('stream:' + msg.id, {
          detail: { content: msg.content, reasoning: msg.reasoning, done: true }
        }));
        saveSessionMessages(oldSession.id);
      }
    }
    state.currentStreamMsgId = null;
  }
  // 3. Clear streaming-related state
  state.isSending = false;
  state.liveReasoning = '';
  state.liveReasoningActive = false;
  state.currentQuestion = null;
  state.status = { type: 'connected', label: '已连接' };
}

async function switchSession(id) {
  if (id === state.currentSessionId) return;
  // Abort any active stream and finalize the old session's streaming message
  abortActiveStream();
  if (state.currentSessionId) saveSessionMessages(state.currentSessionId);
  state.currentSessionId = id;
  const cur = getCurrentSession();
  if (cur) {
    const saved = loadSessionMessages(cur.id);
    if (saved.length > 0) cur.messages = saved;
    const serverMsgs = await fetchMessages(cur.id);
    if (serverMsgs.length > 0) {
      mergeBackendMessages(cur, serverMsgs);
      saveSessionMessages(cur.id);
    }
  }
  saveStorage();
  bump();
  scrollToBottom();
}

// Refresh the list of imported projects (subdirectories of the mobile workspace)
async function refreshImportedProjects() {
  try {
    _importedProjects = await listImportedProjects() || [];
  } catch { _importedProjects = []; }
  bump();
}

// Refresh the list of desktop directories available for import
async function refreshDesktopDirs() {
  try {
    _desktopDirs = await apiJson('/api/scan-directories', { skipDirectory: true }) || [];
  } catch { _desktopDirs = []; }
  bump();
}

async function deleteSession(id) {
  if (state.sessions.length <= 1) { showToast('至少保留一个会话', 'error'); return; }
  const idx = state.sessions.findIndex(s => s.id === id);
  if (idx === -1) return;

  // Call DELETE /api/session/{id} to remove from SQLite backend
  // Per storage-architecture doc: this cascades delete message → part
  try {
    await apiFetch('/api/session/' + encodeURIComponent(id), { method: 'DELETE' });
  } catch (e) {
    console.warn('[Delete] Backend delete failed, removing locally only:', e.message);
  }

  state.sessions.splice(idx, 1);
  delete store.sessions[id];
  delete store.messages[id];
  store.loadedMessages.delete(id);
  if (state.currentSessionId === id) {
    // Abort active stream before switching to the new session
    abortActiveStream();
    state.currentSessionId = state.sessions[0] ? state.sessions[0].id : null;
    if (state.currentSessionId) {
      const saved = loadSessionMessages(state.currentSessionId);
      const cur = getSession(state.currentSessionId);
      if (cur && saved.length > 0) cur.messages = saved;
    }
  }
  localStorage.removeItem('ocr_msgs_' + id);
  saveStorage();
  bump();
}

/* ═══════════════════════════════════════════════════════════════════
   Message Management
   ═══════════════════════════════════════════════════════════════════ */
function addUserMessage(text) {
  const session = getCurrentSession();
  if (!session) return;
  const msg = { id: generateId(), role: 'user', content: text, isStreaming: false, timestamp: Date.now() };
  session.messages.push(msg);
  session.lastActiveAt = Date.now();
  saveSessionMessages(state.currentSessionId);
  saveStorage();
  bump();
  scrollToBottom();
}

function addAssistantPlaceholder() {
  const session = getCurrentSession();
  if (!session) return;
  const msgId = generateId();
  const msg = { id: msgId, role: 'assistant', content: '', reasoning: '', isStreaming: true, timestamp: Date.now(), _contentHash: '' };
  session.messages.push(msg);
  state.currentStreamMsgId = msgId;
  saveSessionMessages(state.currentSessionId);
  bump();
  scrollToBottom();
  return msgId;
}

function finalizeAssistantMessage(msgId) {
  const session = getCurrentSession();
  if (!session) return;
  const msg = session.messages.find(m => m.id === msgId);
  if (msg) {
    if (msg._raf) { cancelAnimationFrame(msg._raf); msg._raf = null; }
    if (msg._saveTimer) { clearTimeout(msg._saveTimer); msg._saveTimer = null; }
    msg.isStreaming = false;
    msg._contentHash = simpleHash(msg.content);
    // Final DOM update via stream bus
    streamBus.dispatchEvent(new CustomEvent('stream:' + msgId, {
      detail: { content: msg.content, reasoning: msg.reasoning, done: true }
    }));
    saveSessionMessages(state.currentSessionId);
    saveStorage();
  }
  if (state.currentStreamMsgId === msgId) state.currentStreamMsgId = null;
  bump();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    const el = document.querySelector('.chat-area');
    if (el) el.scrollTop = el.scrollHeight;
  });
}

/* ═══════════════════════════════════════════════════════════════════
   Send Message (with SSE streaming)
   ═══════════════════════════════════════════════════════════════════ */
function buildMessageBody(text) {
  const body = { parts: [{ type: 'text', text }] };
  const cfg = state.sessionConfig;
  if (cfg.model && cfg.model.id) {
    body.model = { modelID: cfg.model.id, providerID: cfg.model.providerID };
    if (cfg.variant) body.model.variant = cfg.variant;
  }
  if (cfg.agent) body.agent = cfg.agent;
  return JSON.stringify(body);
}

async function sendMessage(retried = false) {
  if (_sendInProgress) return;
  _sendInProgress = true;
  try { await sendMessageInner(retried); }
  finally { _sendInProgress = false; }
}

async function sendMessageInner(retried = false) {
  const input = document.querySelector('.input-bar textarea');
  const text = input ? input.value.trim() : '';
  if (!text || state.isSending || !state.currentSessionId) return;

  state.isSending = true;
  bump();
  addUserMessage(text);
  if (input) input.value = '';
  autoResize(input);

  addAssistantPlaceholder();
  state.status = { type: 'connecting', label: '等待回复...' };
  bump();

  const sep = _currentDirectory ? '?' : '';
  const url = '/api/session/' + encodeURIComponent(state.currentSessionId) + '/message' + sep + (_currentDirectory ? 'directory=' + encodeURIComponent(_currentDirectory) : '');

  try {
    _sendAbortController = new AbortController();
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'X-Auth-Token': getToken(), 'Content-Type': 'application/json' },
      body: buildMessageBody(text),
      signal: _sendAbortController.signal,
    });

    if (!response.ok) {
      let errMsg = 'HTTP ' + response.status;
      try { const e = await response.json(); errMsg = e.error || e.message || errMsg; } catch {}
      if (response.status === 404 && state.currentSessionId && !retried) {
        console.warn('[Send] Session not found, recreating...');
        try {
          const newSession = await createSession();
          state.sessions.push(newSession);
          state.currentSessionId = newSession.id;
          saveStorage(); bump();
          state.isSending = false; bump();
          if (input) input.value = text;
          return sendMessageInner(true);
        } catch (recreateErr) { errMsg = '会话已过期，自动重建失败: ' + recreateErr.message; }
      }
      if (state.currentStreamMsgId) {
        const msg = getCurrentSession()?.messages.find(m => m.id === state.currentStreamMsgId);
        if (msg) { msg.content += '\n\n**错误**: ' + errMsg; msg.isStreaming = false; finalizeAssistantMessage(msg.id); }
      }
      state.isSending = false; bump();
      state.status = { type: 'connected', label: '已连接' };
      showToast('错误: ' + errMsg, 'error');
      return;
    }

    const contentType = response.headers.get('content-type') || '';
    if (contentType.includes('application/json')) {
      // Complete JSON response
      const data = await response.json();
      let content = '', reasoning = '';
      if (data.parts && Array.isArray(data.parts)) {
        data.parts.forEach(p => {
          if (p.type === 'text') content = (content ? content + '\n' : '') + (p.text || '');
          else if (p.type === 'reasoning') reasoning = (reasoning ? reasoning + '\n' : '') + (p.text || '');
        });
      } else if (data.content) content = data.content;
      else if (data.text) content = data.text;
      if (state.currentStreamMsgId && (content || reasoning)) {
        const msg = getCurrentSession()?.messages.find(m => m.id === state.currentStreamMsgId);
        if (msg) {
          msg.content = content || ''; msg.reasoning = reasoning || '';
          msg.isStreaming = false; msg._contentHash = simpleHash(msg.content);
          finalizeAssistantMessage(msg.id);
        }
      }
      if (data.parts) {
        data.parts.forEach(p => {
          if ((p.type === 'tool_call' || p.type === 'tool_use') && p.name) {
            const tcMsg = { id: generateId(), role: 'tool', toolName: p.name, toolArgs: p.arguments || p.input || {}, content: '', isStreaming: false, timestamp: Date.now() };
            getCurrentSession()?.messages.push(tcMsg);
          }
        });
      }
      state.isSending = false; bump();
      state.status = { type: 'connected', label: '已连接' };
      if (!content) showToast('收到空回复', 'info');
      saveSessionMessages(state.currentSessionId); saveStorage();
      bump(); scrollToBottom();
    } else {
      // SSE stream — incremental DOM updates via streamBus
      // Reasoning is accumulated into state.liveReasoning (single panel for entire response)
      // Text content uses textContent during streaming (fast), renderMarkdown when done
      await readSSEFromResponse(response, {
        onDelta: (text) => {
          if (!state.currentStreamMsgId) addAssistantPlaceholder();
          // First text delta: auto-collapse reasoning panel
          if (state.liveReasoningActive) {
            state.liveReasoningActive = false;
            bump();
          }
          const msg = getCurrentSession()?.messages.find(m => m.id === state.currentStreamMsgId);
          if (msg) {
            msg.content += text;
            msg.isStreaming = true;
            if (!msg._raf) {
              msg._raf = requestAnimationFrame(() => {
                msg._raf = null;
                streamBus.dispatchEvent(new CustomEvent('stream:' + msg.id, {
                  detail: { content: msg.content }
                }));
              });
            }
            if (!msg._saveTimer) {
              msg._saveTimer = setTimeout(() => { msg._saveTimer = null; saveSessionMessages(state.currentSessionId); }, 500);
            }
          }
        },
        onReasoningDelta: (text) => {
          if (!state.currentStreamMsgId) addAssistantPlaceholder();
          // Accumulate ALL reasoning into a single panel
          state.liveReasoning = (state.liveReasoning || '') + text;
          state.liveReasoningActive = true;
          const msg = getCurrentSession()?.messages.find(m => m.id === state.currentStreamMsgId);
          if (msg) {
            msg.isStreaming = true;
            if (!msg._raf) {
              msg._raf = requestAnimationFrame(() => {
                msg._raf = null;
                streamBus.dispatchEvent(new CustomEvent('live-reasoning', {
                  detail: { reasoning: state.liveReasoning }
                }));
              });
            }
          }
        },
        onMessage: (content, parsed) => {
          // Accumulate reasoning parts into liveReasoning
          if (parsed?.parts && Array.isArray(parsed.parts)) {
            const rp = parsed.parts.filter(p => p.type === 'reasoning');
            if (rp.length) {
              state.liveReasoning = (state.liveReasoning || '') + rp.map(p => p.text || '').join('\n');
            }
          }
          if (state.currentStreamMsgId) {
            const msg = getCurrentSession()?.messages.find(m => m.id === state.currentStreamMsgId);
            if (msg) {
              if (content) msg.content = content;
              msg.isStreaming = false;
              msg._contentHash = simpleHash(msg.content);
              finalizeAssistantMessage(msg.id);
            }
          } else if (content) {
            const msg = { id: generateId(), role: 'assistant', content, isStreaming: false, timestamp: Date.now(), _contentHash: simpleHash(content) };
            getCurrentSession()?.messages.push(msg);
            saveSessionMessages(state.currentSessionId); saveStorage();
            bump(); scrollToBottom();
          }
        },
        onToolCall: (parsed) => {
          if (state.currentStreamMsgId) finalizeAssistantMessage(state.currentStreamMsgId);
          const name = parsed.name || parsed.tool || 'tool';
          const args = parsed.arguments || parsed.input || parsed.args || {};
          const msg = { id: generateId(), role: 'tool', toolName: name, toolArgs: args, content: parsed.content || '', isStreaming: false, timestamp: Date.now() };
          getCurrentSession()?.messages.push(msg);
          saveSessionMessages(state.currentSessionId); saveStorage();
          bump(); scrollToBottom();
        },
        onToolResult: (parsed) => {
          const session = getCurrentSession();
          if (!session) return;
          const resultContent = parsed.content || parsed.result || JSON.stringify(parsed);
          for (let i = session.messages.length - 1; i >= 0; i--) {
            if (session.messages[i].role === 'tool') { session.messages[i].content = (session.messages[i].content ? session.messages[i].content + '\n' : '') + resultContent; break; }
          }
          saveSessionMessages(state.currentSessionId); saveStorage();
          bump();
        },
        onDone: () => {
          if (state.currentStreamMsgId) {
            // Attach accumulated reasoning to the final message
            const msg = getCurrentSession()?.messages.find(m => m.id === state.currentStreamMsgId);
            if (msg && state.liveReasoning) {
              msg.reasoning = state.liveReasoning;
            }
            finalizeAssistantMessage(state.currentStreamMsgId);
          }
          state.liveReasoning = '';
          state.liveReasoningActive = false;
          state.isSending = false; bump();
          state.status = { type: 'connected', label: '已连接' };
        },
        onError: (parsed) => {
          const errMsg = parsed.error || parsed.message || 'Unknown error';
          showToast('错误: ' + errMsg, 'error');
          if (state.currentStreamMsgId) {
            const msg = getCurrentSession()?.messages.find(m => m.id === state.currentStreamMsgId);
            if (msg) { msg.content += '\n\n**错误**: ' + errMsg; msg.isStreaming = false; finalizeAssistantMessage(msg.id); }
          }
          state.liveReasoning = '';
          state.liveReasoningActive = false;
          state.isSending = false; bump();
        },
        onQuestion: (parsed) => {
          const requestID = parsed.requestID || parsed.request_id || parsed.id;
          if (requestID && !state.currentQuestion) {
            state.currentQuestion = { requestID, question: parsed.question || parsed.message || '请选择:', type: parsed.type || 'text', options: parsed.options || [] };
            bump();
          }
        },
      });
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      if (state.currentStreamMsgId) finalizeAssistantMessage(state.currentStreamMsgId);
    } else {
      console.warn('[Send] Error:', err.message);
      showToast('发送失败: ' + err.message, 'error');
    }
    state.isSending = false; bump();
    state.status = { type: 'connected', label: '已连接' };
  }
}

function autoResize(el) {
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

/* ═══════════════════════════════════════════════════════════════════
   Global Event Stream
   ═══════════════════════════════════════════════════════════════════ */
async function connectGlobalEventStream() {
  const token = getToken();
  if (!token) return;
  try {
    const response = await fetch('/api/global/event', { headers: { 'X-Auth-Token': token } });
    if (!response.ok) { if (response.status === 401) { scheduleEventReconnect(); return; } throw new Error('HTTP ' + response.status); }
    console.log('[Events] Connected to global event stream');
    const reader = response.body.getReader();
    _eventReader = reader;
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      while (buffer.includes('\n')) {
        const nlIdx = buffer.indexOf('\n');
        const line = buffer.slice(0, nlIdx);
        buffer = buffer.slice(nlIdx + 1);
        if (line.startsWith('data: ')) {
          try { const parsed = JSON.parse(line.slice(6)); const payload = parsed.payload || parsed; if (payload.type) handleGlobalEvent(payload); }
          catch (e) { /* skip malformed */ }
        }
      }
    }
  } catch (err) { if (err.name === 'AbortError') return; console.warn('[Events] Stream disconnected:', err.message); }
  scheduleEventReconnect();
}

function scheduleEventReconnect() {
  clearTimeout(_eventReconnectTimer);
  _eventReconnectTimer = setTimeout(connectGlobalEventStream, EVENT_RECONNECT_DELAY);
}

function handleGlobalEvent(payload) {
  const type = payload.type;
  const props = payload.properties || {};
  switch (type) {
    case 'session.created':
    case 'session.error':
      if (props.info) {
        const s = props.info;
        store.sessions[s.id] = s;
        store.loadedDirSessions.add(s.directory);
        const sDir = s.directory || '';
        if (sDir === _currentDirectory || sDir.endsWith('\\' + _currentDirectory.split('\\').pop())) {
          if (!state.sessions.find(x => x.id === s.id)) {
            state.sessions.push({ id: s.id, slug: s.slug || '', title: s.title || '会话', messages: store.messages[s.id] || [], createdAt: s.time?.created || Date.now(), lastActiveAt: s.time?.updated || Date.now() });
          }
        }
        bump();
      }
      break;
    case 'session.updated':
      if (props.info) {
        const s = props.info;
        store.sessions[s.id] = s;
        const existing = state.sessions.find(x => x.id === s.id);
        if (existing) { existing.title = s.title || existing.title; existing.lastActiveAt = s.time?.updated || existing.lastActiveAt; }
        // Bug #4 fix: if this is the current session and we're not actively streaming,
        // refresh messages so we see updates from other clients
        if (s.id === state.currentSessionId && !state.isSending && !state.currentStreamMsgId) {
          fetchMessages(s.id).then(msgs => {
            if (msgs && msgs.length > 0) {
              const cur = getCurrentSession();
              if (cur) { mergeBackendMessages(cur, msgs); saveSessionMessages(cur.id); bump(); }
            }
          }).catch(() => { /* ignore fetch errors */ });
        }
        bump();
      }
      break;
    case 'session.deleted':
      const delId = props.sessionID || props.info?.id;
      if (delId) {
        delete store.sessions[delId];
        delete store.messages[delId];
        store.loadedMessages.delete(delId);
        const idx = state.sessions.findIndex(x => x.id === delId);
        if (idx !== -1) {
          state.sessions.splice(idx, 1);
          if (state.currentSessionId === delId) {
            // Abort active stream before switching
            abortActiveStream();
            state.currentSessionId = state.sessions[0]?.id || null;
            if (state.currentSessionId) {
              const cur = getSession(state.currentSessionId);
              if (cur) { const saved = loadSessionMessages(cur.id); if (saved.length > 0) cur.messages = saved; }
            }
          }
        }
        bump();
      }
      break;
    case 'question.created':
      if (props.question) {
        const q = props.question;
        const requestID = q.requestID || q.request_id || q.id || props.requestID;
        if (requestID && !state.currentQuestion) {
          state.currentQuestion = { requestID, question: q.question || q.message || '请选择:', type: q.type || 'text', options: q.options || [] };
          bump();
        }
      }
      break;
    case 'question.answered':
    case 'question.rejected':
      const reqID = props.requestID;
      if (reqID && state.currentQuestion?.requestID === reqID) { state.currentQuestion = null; bump(); }
      break;
    case 'sync':
      if (payload.syncEvent?.data?.info) {
        const syncInfo = payload.syncEvent.data.info;
        store.sessions[syncInfo.id] = syncInfo;
        store.loadedDirSessions.add(syncInfo.directory);
        const sDir = syncInfo.directory || '';
        if (sDir === _currentDirectory || sDir.endsWith('\\' + _currentDirectory.split('\\').pop())) {
          if (!state.sessions.find(x => x.id === syncInfo.id)) {
            state.sessions.push({ id: syncInfo.id, slug: syncInfo.slug || '', title: syncInfo.title || '会话', messages: [], createdAt: syncInfo.time?.created || Date.now(), lastActiveAt: syncInfo.time?.updated || Date.now() });
            bump();
          }
        }
      }
      break;
  }
}

/* ═══════════════════════════════════════════════════════════════════
   Question Polling (fallback)
   ═══════════════════════════════════════════════════════════════════ */
async function pollQuestions() {
  if (!state.currentSessionId) return;
  if (!state.isSending && !state.currentStreamMsgId && !state.currentQuestion) return;
  try {
    const questions = await apiJson('/api/question');
    if (questions && questions.length > 0) {
      const q = questions[0];
      const requestID = q.requestID || q.request_id || q.id;
      if (requestID && !state.currentQuestion) {
        state.currentQuestion = { requestID, question: q.question || q.message || '请选择:', type: q.type || 'text', options: q.options || [] };
        bump();
      }
    }
  } catch (err) { /* silently ignore */ }
}

async function answerQuestion(answer) {
  if (!state.currentQuestion) return;
  if (!answer) { showToast('请输入或选择一个回答', 'info'); return; }
  const requestID = state.currentQuestion.requestID;
  try {
    await apiFetch('/api/question/' + encodeURIComponent(requestID) + '/reply', { method: 'POST', body: JSON.stringify({ answer }) });
    state.currentQuestion = null;
    showToast('回答已发送', 'success');
    bump();
  } catch (err) { showToast('发送回答失败: ' + err.message, 'error'); }
}

/* ═══════════════════════════════════════════════════════════════════
   Toast System
   ═══════════════════════════════════════════════════════════════════ */
function showToast(msg, type) {
  const id = Date.now() + Math.random();
  state.toasts.push({ id, msg, type: type || 'info' });
  bump();
  setTimeout(() => {
    const idx = state.toasts.findIndex(t => t.id === id);
    if (idx !== -1) { state.toasts.splice(idx, 1); bump(); }
  }, 3000);
}

/* ═══════════════════════════════════════════════════════════════════
   Theme System — accent color + background customization
   ═══════════════════════════════════════════════════════════════════ */
const ACCENT_PRESETS = [
  { id: 'terracotta', name: '赤陶',     hex: '#D97757' },
  { id: 'amber',      name: '琥珀',     hex: '#F5A623' },
  { id: 'emerald',    name: '翡翠',     hex: '#10B981' },
  { id: 'sapphire',   name: '蓝宝',     hex: '#3B82F6' },
  { id: 'amethyst',   name: '紫晶',     hex: '#8B5CF6' },
  { id: 'rose',       name: '玫瑰',     hex: '#F43F5E' },
  { id: 'cyan',       name: '青蓝',     hex: '#06B6D4' },
  { id: 'coral',      name: '珊瑚',     hex: '#FF6B6B' },
];

const BG_PRESETS = [
  { id: 'midnight',   name: '暗夜',     bg: '#141416', bg2: '#1d1d20', orb1: 'rgba(217,119,87,.10)', isLight: false },
  { id: 'deepblue',   name: '深蓝',     bg: '#0F1419', bg2: '#181F26', orb1: 'rgba(59,130,246,.10)', isLight: false },
  { id: 'warmgray',   name: '暖灰',     bg: '#1A1A1E', bg2: '#242428', orb1: 'rgba(245,166,35,.08)', isLight: false },
  { id: 'forest',     name: '墨绿',     bg: '#0D1A14', bg2: '#14241C', orb1: 'rgba(16,185,129,.10)', isLight: false },
  { id: 'plum',       name: '深紫',     bg: '#1A0D1A', bg2: '#261426', orb1: 'rgba(139,92,246,.10)', isLight: false },
  { id: 'carbon',     name: '纯黑',     bg: '#0A0A0A', bg2: '#161616', orb1: 'rgba(255,255,255,.04)', isLight: false },
  { id: 'snow',       name: '雪白',     bg: '#EDEDF0', bg2: '#F7F7FA', orb1: 'rgba(217,119,87,.08)', isLight: true },
  { id: 'paper',      name: '纸白',     bg: '#F2F0EC', bg2: '#FBFAF7', orb1: 'rgba(139,115,85,.06)', isLight: true },
  { id: 'mist',       name: '雾灰',     bg: '#E4E5E8', bg2: '#EFF0F3', orb1: 'rgba(100,116,139,.08)', isLight: true },
];

const DEFAULT_THEME = { accent: 'terracotta', bg: 'midnight', customAccent: null };

function hexToRgb(hex) {
  const m = hex.replace('#', '');
  const r = parseInt(m.slice(0, 2), 16);
  const g = parseInt(m.slice(2, 4), 16);
  const b = parseInt(m.slice(4, 6), 16);
  return { r, g, b };
}

function darken(hex, amount) {
  const { r, g, b } = hexToRgb(hex);
  const f = 1 - amount;
  const toHex = v => Math.max(0, Math.round(v * f)).toString(16).padStart(2, '0');
  return '#' + toHex(r) + toHex(g) + toHex(b);
}

function rgba(hex, alpha) {
  const { r, g, b } = hexToRgb(hex);
  return `rgba(${r},${g},${b},${alpha})`;
}

function getAccentHex(theme) {
  if (theme.customAccent) return theme.customAccent;
  const preset = ACCENT_PRESETS.find(a => a.id === theme.accent);
  return preset ? preset.hex : ACCENT_PRESETS[0].hex;
}

function getBgPreset(theme) {
  return BG_PRESETS.find(b => b.id === theme.bg) || BG_PRESETS[0];
}

function applyTheme(theme) {
  const root = document.documentElement;
  const accentHex = getAccentHex(theme);
  const bgPreset = getBgPreset(theme);

  // Set data-theme for light/dark CSS overrides
  root.setAttribute('data-theme', bgPreset.isLight ? 'light' : 'dark');

  // Accent derived values
  root.style.setProperty('--p', accentHex);
  root.style.setProperty('--pd', darken(accentHex, 0.18));
  root.style.setProperty('--pdim', rgba(accentHex, 0.14));
  root.style.setProperty('--pglow', rgba(accentHex, 0.28));

  // Background derived values
  root.style.setProperty('--bg', bgPreset.bg);
  root.style.setProperty('--bg2', bgPreset.bg2);

  // Update body gradient + orb1 color to match accent
  root.style.setProperty('--orb1-color', rgba(accentHex, 0.10));

  // Update dynamic elements that reference these
  document.body.style.background = `radial-gradient(120% 90% at 50% 0%, ${bgPreset.bg2} 0%, ${bgPreset.bg} 100%)`;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', bgPreset.bg);

  // Update ambient orb-1 to use accent color
  const orb1 = document.querySelector('.orb-1');
  if (orb1) orb1.style.background = `radial-gradient(circle, ${rgba(accentHex, 0.10)}, transparent 70%)`;
}

function loadTheme() {
  try {
    const saved = localStorage.getItem('ocr_theme');
    if (saved) {
      const theme = JSON.parse(saved);
      applyTheme(theme);
      return theme;
    }
  } catch (e) {}
  applyTheme(DEFAULT_THEME);
  return DEFAULT_THEME;
}

function saveTheme(theme) {
  try {
    localStorage.setItem('ocr_theme', JSON.stringify(theme));
  } catch (e) {}
  applyTheme(theme);
}

function resetTheme() {
  try { localStorage.removeItem('ocr_theme'); } catch (e) {}
  applyTheme(DEFAULT_THEME);
}

/* ═══════════════════════════════════════════════════════════════════
   AuthPage — Login + First-time Setup
   ═══════════════════════════════════════════════════════════════════ */
function AuthPage({ mode, onSuccess }) {
  const [password, setPassword] = useState('');
  const [confirm, setConfirm] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [showPw2, setShowPw2] = useState(false);
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState(false);
  const pwRef = useRef(null);

  useEffect(() => { setTimeout(() => { if (pwRef.current) pwRef.current.focus(); }, 200); }, []);

  async function handleSetup() {
    const pwd = password.trim();
    if (pwd.length < 4) { setError('密码至少需要4位字符'); return; }
    if (pwd !== confirm.trim()) { setError('两次输入的密码不一致'); return; }
    setError(''); setLoading(true);
    try {
      const res = await fetch('/api/setup', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd }),
      });
      const data = await res.json();
      if (data.ok) { setSuccess(true); }
      else {
        const map = { password_min_length: '密码至少需要4位字符', invalid_json: '请求数据格式错误' };
        setError(map[data.error] || data.error || '保存失败');
      }
    } catch (e) { setError('网络错误，无法保存密码'); }
    setLoading(false);
  }

  async function handleLogin() {
    const pwd = password.trim();
    if (!pwd) { setError('请输入密码'); return; }
    setError(''); setLoading(true);
    try {
      const res = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd }),
      });
      const data = await res.json();
      if (data.ok && data.token) {
        sessionStorage.setItem('ocr_token', data.token);
        state.token = data.token;
        onSuccess();
      } else {
        const map = { invalid_password: '密码错误', not_configured: '系统未配置密码', password_required: '请输入密码' };
        setError(map[data.error] || data.error || '登录失败');
      }
    } catch (e) { setError('网络错误，无法连接服务器'); }
    setLoading(false);
  }

  if (success) {
    return html`
      <div class="auth-page">
        <div class="ambient"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
        <div class="auth-card">
          <div class="auth-success show">
            <div class="check-circle"><span dangerouslySetInnerHTML=${raw(ICONS.checkCircle)} /></div>
            <div class="auth-title" style="margin-bottom:8px">密码已保存</div>
            <div class="auth-subtitle" style="margin-bottom:20px">请重启 Relay 服务后使用新密码登录</div>
            <button class="auth-btn" onClick=${() => location.reload()}>重新加载页面</button>
          </div>
        </div>
      </div>
    `;
  }

  const isSetup = mode === 'setup';
  return html`
    <div class="auth-page">
      <div class="ambient"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>
      <div class="auth-card">
        <div class="auth-logo" dangerouslySetInnerHTML=${raw(ICONS.logo)} />
        <div class="auth-title">${isSetup ? '设置密码' : 'OpenCode Relay'}</div>
        <div class="auth-subtitle">${isSetup ? '首次使用，请设置访问密码' : '请输入密码以继续'}</div>
        ${error ? html`<div class="auth-error show">${error}</div>` : null}
        <div class="auth-field">
          <input type=${showPw ? 'text' : 'password'} placeholder="输入密码"
            value=${password} onInput=${e => setPassword(e.target.value)}
            ref=${pwRef} autocomplete=${isSetup ? 'new-password' : 'current-password'}
            onKeyDown=${e => { if (e.key === 'Enter') { isSetup ? (confirm && handleSetup()) : handleLogin(); }} } />
          <button class="pw-toggle" onClick=${() => setShowPw(!showPw)} dangerouslySetInnerHTML=${raw(showPw ? ICONS.eyeOff : ICONS.eye)} />
        </div>
        ${isSetup ? html`
          <div class="auth-field">
            <input type=${showPw2 ? 'text' : 'password'} placeholder="再次输入密码"
              value=${confirm} onInput=${e => setConfirm(e.target.value)}
              autocomplete="new-password"
              onKeyDown=${e => { if (e.key === 'Enter') handleSetup(); }} />
            <button class="pw-toggle" onClick=${() => setShowPw2(!showPw2)} dangerouslySetInnerHTML=${raw(showPw2 ? ICONS.eyeOff : ICONS.eye)} />
          </div>
        ` : null}
        <button class="auth-btn" disabled=${loading} onClick=${isSetup ? handleSetup : handleLogin}>
          ${loading ? html`<div class="spinner"></div>` : (isSetup ? '保存密码' : '登录')}
        </button>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   Sidebar — session history + project import
   ═══════════════════════════════════════════════════════════════════ */
function Sidebar() {
  useBump();
  const [importPath, setImportPath] = useState('');
  const [importLoading, setImportLoading] = useState(false);
  const [importError, setImportError] = useState('');
  const [importingDir, setImportingDir] = useState(null);

  async function handleNewSession() {
    try {
      const session = await createSession();
      state.sessions.push(session);
      state.currentSessionId = session.id;
      state.sidebarOpen = false;
      saveStorage();
      bump();
      scrollToBottom();
    } catch (e) { showToast('创建会话失败: ' + e.message, 'error'); }
  }

  async function handleImportPath() {
    const p = importPath.trim();
    if (!p) { setImportError('请输入路径'); return; }
    setImportError(''); setImportLoading(true);
    try {
      const result = await importProject(p);
      if (result.ok) {
        showToast('已导入 ' + result.name + ' (' + result.files + ' 个文件)', 'success');
        setImportPath('');
        await refreshImportedProjects();
      } else {
        setImportError(result.error || '导入失败');
      }
    } catch (e) {
      let msg = e.message || '未知错误';
      try { const j = JSON.parse(msg); msg = j.error || msg; } catch {}
      setImportError(msg);
    }
    setImportLoading(false);
  }

  async function handleImportDesktop(dir) {
    const dirPath = typeof dir === 'string' ? dir : dir.path;
    const dirName = typeof dir === 'string' ? dirBasename(dir) : dir.name;
    setImportingDir(dirPath);
    try {
      const result = await importProject(dirPath);
      if (result.ok) {
        showToast('已导入 ' + result.name + ' (' + result.files + ' 个文件)', 'success');
        await refreshImportedProjects();
      } else {
        let msg = result.error || '导入失败';
        showToast(msg, 'error');
      }
    } catch (e) {
      let msg = e.message || '未知错误';
      try { const j = JSON.parse(msg); msg = j.error || msg; } catch {}
      showToast(msg, 'error');
    }
    setImportingDir(null);
  }

  async function handleDeleteImported(name) {
    try {
      await deleteImportedProject(name);
      showToast('已删除 ' + name, 'success');
      await refreshImportedProjects();
    } catch (e) {
      let msg = e.message || '未知错误';
      try { const j = JSON.parse(msg); msg = j.error || msg; } catch {}
      showToast('删除失败: ' + msg, 'error');
    }
  }

  return html`
    <div class=${'sidebar-overlay' + (state.sidebarOpen ? ' open' : '')}
      onClick=${() => { state.sidebarOpen = false; bump(); }} />
    <aside class=${'sidebar' + (state.sidebarOpen ? ' open' : '')}>
      <div class="sidebar-header">
        <h3>历史会话</h3>

          dangerouslySetInnerHTML=${raw(ICONS.close)} />

        <button class="primary" onClick=${handleNewSession}>
          <span dangerouslySetInnerHTML=${raw(ICONS.plus)} />
          <span>新建会话</span>
        </button>
      </div>
      <div class="session-list">
        ${state.sessions.length === 0 ? html`
          <div style="text-align:center;padding:40px 16px;color:var(--t3);font-size:13px">暂无会话</div>
        ` : state.sessions.map((s, i) => html`
          <div class=${'session-item' + (s.id === state.currentSessionId ? ' active' : '')}
            onClick=${() => switchSession(s.id)}
            style=${`animation-delay:${Math.min(0.03 * i, 0.3)}s`}>
            <div class="si-icon"><span dangerouslySetInnerHTML=${raw(ICONS.chat)} /></div>
            <div class="si-info">
              <div class="si-title">${s.title || '新会话'}</div>
              <div class="si-meta">
                ${timeAgo(s.lastActiveAt || s.createdAt)}

            <button class="del-btn" onClick=${e => { e.stopPropagation(); deleteSession(s.id); }}

          </div>

        ${_desktopDirs.length > 0 ? html`
          <div class="si-desktop-list">
            ${_desktopDirs.map(d => {

              return html`

                        </button>

        ${_importedProjects.length > 0 ? html`
          <div class="si-imported-list">

/* ═══════════════════════════════════════════════════════════════════
   PillDropdown — reusable pill-style dropdown selector
   ═══════════════════════════════════════════════════════════════════ */
function PillDropdown({ label, items, currentKey, onSelect, searchable, maxWidth }) {
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState('');
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    function handler(e) {
      if (ref.current && !ref.current.contains(e.target)) { setOpen(false); setSearch(''); }
    }
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  const filtered = search
    ? items.filter(i => (i.name || '').toLowerCase().includes(search.toLowerCase()))
    : items;

  return html`
    <div ref=${ref} style="position:relative">
      <button class="pill" aria-expanded=${open}
        style=${maxWidth ? 'max-width:' + maxWidth + 'px' : ''}
        onClick=${() => setOpen(!open)}>
        <span class="pill-label">${label}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>
      ${open ? html`
        <div class="dropdown-menu open"
          style="position:absolute;bottom:calc(100% + 6px);left:0;min-width:100%;max-width:280px">
          ${searchable ? html`
            <div class="menu-search">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" /><path d="M21 21l-4.35-4.35" />
              </svg>
              <input type="text" placeholder="搜索..." value=${search}
                onInput=${e => setSearch(e.target.value)} autoFocus />
            </div>
          ` : null}
          ${filtered.length === 0 ? html`
            <div style="padding:16px;text-align:center;color:var(--t3);font-size:13px">无选项</div>
          ` : filtered.map(item => html`
            <div class=${'menu-item' + (item.key === currentKey ? ' selected' : '')}
              onClick=${() => { onSelect(item); setOpen(false); setSearch(''); }}>
              <div class="mi-text">
                <div class="mi-name">${item.name}</div>
                ${item.desc ? html`<div class="mi-desc">${item.desc}</div>` : null}
              </div>
              <div class="mi-check" dangerouslySetInnerHTML=${raw(ICONS.check)} />
            </div>
          `)}
        </div>
      ` : null}
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   MessageItem — renders a single message (user/assistant/tool)
   Streaming: textContent for speed, renderMarkdown when done
   Reasoning: single panel via state.liveReasoning (not per-message)
   ═══════════════════════════════════════════════════════════════════ */
function MessageItem({ msg }) {
  useBump();
  const contentRef = useRef(null);
  const reasoningRef = useRef(null);
  const [toolOpen, setToolOpen] = useState(false);
  const [reasoningOpen, setReasoningOpen] = useState(true);

  const isCurrentStream = msg.isStreaming && state.currentStreamMsgId === msg.id;

  // Render finalized content with full markdown
  useEffect(() => {
    if (contentRef.current && !msg.isStreaming) {
      contentRef.current.innerHTML = renderMarkdown(msg.content);
      contentRef.current.classList.remove('streaming-cursor');
    }
  }, [msg.content, msg._contentHash, msg.isStreaming]);

  // Streaming text: use textContent (fast), switch to renderMarkdown when done
  useEffect(() => {
    if (!isCurrentStream) return;
    if (contentRef.current) contentRef.current.classList.add('streaming-cursor');
    function onStream(e) {
      const { content, done } = e.detail;
      if (contentRef.current) {
        if (done) {
          // Streaming finished: render full markdown
          contentRef.current.classList.remove('streaming-cursor');
          contentRef.current.innerHTML = renderMarkdown(content);
        } else {
          // During streaming: textContent is instant (no markdown parsing)
          contentRef.current.textContent = content;
        }
      }
    }
    streamBus.addEventListener('stream:' + msg.id, onStream);
    return () => {
      streamBus.removeEventListener('stream:' + msg.id, onStream);
      if (contentRef.current) contentRef.current.classList.remove('streaming-cursor');
    };
  }, [isCurrentStream, msg.id]);

  // Streaming reasoning: listen on live-reasoning streamBus (single panel)
  useEffect(() => {
    if (!isCurrentStream) return;
    function onReasoning(e) {
      const { reasoning } = e.detail;
      if (reasoningRef.current) {
        reasoningRef.current.textContent = reasoning;
      }
    }
    streamBus.addEventListener('live-reasoning', onReasoning);
    return () => streamBus.removeEventListener('live-reasoning', onReasoning);
  }, [isCurrentStream, msg.id]);

  // Auto-collapse reasoning when text output starts
  useEffect(() => {
    if (isCurrentStream) {
      setReasoningOpen(state.liveReasoningActive);
    }
  }, [state.liveReasoningActive, isCurrentStream]);

  // Tool message
  if (msg.role === 'tool') {
    return html`
      <div class="msg tool">
        <div class="tool-call">
          <div class=${'tool-header' + (toolOpen ? ' open' : '')} onClick=${() => setToolOpen(!toolOpen)}>
            <span dangerouslySetInnerHTML=${raw(ICONS.chevronRight)} />
            <span class="tool-name">${msg.toolName || 'tool'}</span>
            <span class="tool-badge">tool</span>
          </div>
          <div class=${'tool-body' + (toolOpen ? ' open' : '')}>
            ${Object.keys(msg.toolArgs || {}).length > 0 ? html`<pre>${JSON.stringify(msg.toolArgs, null, 2)}</pre>` : null}
            ${msg.content ? html`<pre>${msg.content}</pre>` : null}
          </div>
        </div>
      </div>
    `;
  }

  // Streaming message: show reasoning from state.liveReasoning (single panel)
  // Finalized message: show per-message reasoning (collapsed by default)
  const showReasoning = isCurrentStream
    ? !!state.liveReasoning
    : !!msg.reasoning;

  const showTyping = isCurrentStream && !msg.content && !state.liveReasoning;

  return html`
    <div class=${'msg ' + msg.role}>
      <div class="msg-bubble">
        ${showReasoning ? html`
          <details class="reasoning-block" open=${isCurrentStream ? reasoningOpen : false}>
            <summary class="reasoning-summary" onClick=${(e) => { if (isCurrentStream) { e.preventDefault(); setReasoningOpen(!reasoningOpen); } }}>
              <span dangerouslySetInnerHTML=${raw(ICONS.chevronRight)} />
              <span class="rs-label">思考过程</span>
              <span class="rs-badge">thinking</span>
            </summary>
            <div class="reasoning-content" ref=${reasoningRef}>
              ${!isCurrentStream && msg.reasoning ? html`<span dangerouslySetInnerHTML=${raw(renderMarkdown(msg.reasoning))} />` : null}
            </div>
          </details>
        ` : null}
        ${showTyping ? html`
          <div class="typing-dots"><span></span><span></span><span></span></div>
        ` : html`
          <div class="md-content" ref=${contentRef}></div>
        `}
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   InputBar — textarea + model/agent/variant pills + send/stop
   ═══════════════════════════════════════════════════════════════════ */
function InputBar() {
  useBump();
  const taRef = useRef(null);
  const cfg = state.sessionConfig;

  useEffect(() => { if (taRef.current) autoResize(taRef.current); }, []);

  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  // Build model items
  const modelItems = _allModels.map(m => ({
    key: m.providerID + '/' + m.id,
    name: m.name || m.id,
    desc: m.providerName,
  }));
  const currentModelKey = cfg.model ? (cfg.model.providerID + '/' + cfg.model.id) : '';
  const currentModelName = _allModels.find(m =>
    m.providerID === (cfg.model && cfg.model.providerID) && m.id === (cfg.model && cfg.model.id)
  )?.name || '模型';

  // Build agent items
  const agentItems = _allAgents.map(a => ({ key: a.id, name: a.name, desc: a.description }));
  const currentAgentName = _allAgents.find(a => a.id === cfg.agent)?.name || '代理';

  // Build variant items (only if model supports reasoning)
  const currentModel = _allModels.find(m =>
    m.providerID === (cfg.model && cfg.model.providerID) && m.id === (cfg.model && cfg.model.id)
  );
  const showVariants = !currentModel || currentModel.reasoning !== false;
  const variantItems = _allVariants.map(v => ({ key: v.id, name: v.name, desc: v.description }));
  const currentVariantName = _allVariants.find(v => v.id === cfg.variant)?.name || '强度';

  return html`
    <div class="input-area">
      <div class="input-bar">
        <textarea ref=${taRef} placeholder="输入消息..."
          onInput=${e => autoResize(e.target)} onKeyDown=${handleKeyDown}
          disabled=${!state.currentSessionId}
          rows="1" autocomplete="off" autocorrect="off" autocapitalize="off"
          spellcheck="false" enterKeyHint="send" />
        <div class="input-controls">
          <div class="left">
            <div class="sparkle" dangerouslySetInnerHTML=${raw(ICONS.sparkle)} />
            <${PillDropdown} label=${currentModelName} items=${modelItems}
              currentKey=${currentModelKey} searchable=${true} maxWidth="120"
              onSelect=${item => {
                const idx = item.key.indexOf('/');
                state.sessionConfig.model = {
                  id: item.key.slice(idx + 1),
                  providerID: item.key.slice(0, idx),
                };
                bump();
              }} />
            <${PillDropdown} label=${currentAgentName} items=${agentItems}
              currentKey=${cfg.agent || ''} maxWidth="100"
              onSelect=${item => { state.sessionConfig.agent = item.key; bump(); }} />
            ${showVariants ? html`
              <${PillDropdown} label=${currentVariantName} items=${variantItems}
                currentKey=${cfg.variant || ''} maxWidth="80"
                onSelect=${item => { state.sessionConfig.variant = item.key; bump(); }} />
            ` : null}
          </div>
          <div class="right">
            ${state.isSending ? html`
              <button class="icon-btn stop-btn" onClick=${stopSending}
                dangerouslySetInnerHTML=${raw(ICONS.stop)} />
            ` : html`
              <button class="icon-btn send-btn" onClick=${sendMessage}
                disabled=${!state.currentSessionId}
                dangerouslySetInnerHTML=${raw(ICONS.send)} />
            `}
          </div>
        </div>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   ColorPicker — neumorphic custom color picker (replaces native input)
   ═══════════════════════════════════════════════════════════════════ */
function hexToHue(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  if (max === min) return 0;
  const d = max - min;
  let h;
  if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
  else if (max === g) h = ((b - r) / d + 2) / 6;
  else h = ((r - g) / d + 4) / 6;
  return Math.round(h * 360);
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const k = (n + h / 30) % 12;
    const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(255 * c).toString(16).padStart(2, '0');
  };
  return '#' + f(0) + f(8) + f(4);
}

function ColorPicker({ value, onChange }) {
  const [open, setOpen] = useState(false);
  const [hue, setHue] = useState(hexToHue(value));
  const [hexInput, setHexInput] = useState(value.toUpperCase());
  const ref = useRef(null);

  // Sync internal state when external value changes
  useEffect(() => {
    setHue(hexToHue(value));
    setHexInput(value.toUpperCase());
  }, [value]);

  // Close on outside click
  useEffect(() => {
    if (!open) return;
    function handler(e) {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  // Quick-pick colors
  const quickPicks = [
    '#D97757', '#F5A623', '#10B981', '#3B82F6', '#8B5CF6',
    '#F43F5E', '#06B6D4', '#FF6B6B', '#84CC16', '#EC4899',
  ];

  function applyHue(newHue) {
    setHue(newHue);
    const newHex = hslToHex(newHue, 65, 55);
    setHexInput(newHex.toUpperCase());
    onChange(newHex);
  }

  function applyHex(input) {
    setHexInput(input.toUpperCase());
    let normalized = input.trim();
    if (!normalized.startsWith('#')) normalized = '#' + normalized;
    if (/^#[0-9a-fA-F]{6}$/.test(normalized)) {
      setHue(hexToHue(normalized));
      onChange(normalized.toLowerCase());
    }
  }

  return html`
    <div ref=${ref} style="position:relative">
      <div class="cp-trigger" onClick=${() => setOpen(!open)}>
        <div class="cp-dot" style=${`background:${value}`} />
      </div>
      ${open ? html`
        <div class="cp-panel open">
          <div class="cp-preview" style=${`background:${value}`} />
          <input type="range" class="cp-hue-slider" min="0" max="360" value=${hue}
            onInput=${e => applyHue(parseInt(e.target.value))} />
          <div class="cp-hex-row">
            <span class="cp-hex-label">HEX</span>
            <input type="text" class="cp-hex-input" value=${hexInput} maxlength="7"
              onInput=${e => applyHex(e.target.value)} />
          </div>
          <div class="cp-quick">
            ${quickPicks.map(c => html`
              <div class="cp-quick-dot" style=${`background:${c}`}
                onClick=${() => { applyHex(c); }} />
            `)}
          </div>
        </div>
      ` : null}
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   SettingsPanel — password change, theme, about, logout
   ═══════════════════════════════════════════════════════════════════ */
function SettingsPanel() {
  useBump();
  const [pwMode, setPwMode] = useState(false);
  const [pw, setPw] = useState('');
  const [pwConfirm, setPwConfirm] = useState('');
  const [pwError, setPwError] = useState('');
  const [pwLoading, setPwLoading] = useState(false);
  const [pwSuccess, setPwSuccess] = useState(false);
  const [theme, setTheme] = useState(loadTheme());

  if (!state.settingsOpen) return null;

  function handleLogout() {
    sessionStorage.removeItem('ocr_token');
    state.token = null;
    state.authState = 'login';
    state.settingsOpen = false;
    bump();
  }

  async function handleChangePw() {
    if (pw.length < 4) { setPwError('密码至少需要4位字符'); return; }
    if (pw !== pwConfirm) { setPwError('两次输入的密码不一致'); return; }
    setPwError(''); setPwLoading(true);
    try {
      const res = await fetch('/api/setup', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      });
      const data = await res.json();
      if (data.ok) { setPwSuccess(true); }
      else { setPwError('保存失败'); }
    } catch (e) { setPwError('网络错误'); }
    setPwLoading(false);
  }

  return html`
    <div class="settings-panel open">
      <div class="sp-nav">
        <button class="back-btn" onClick=${() => { state.settingsOpen = false; bump(); }}
          dangerouslySetInnerHTML=${raw(ICONS.arrowLeft)} />
        <h3>设置</h3>
      </div>
      <div class="sp-body">
        <div class="sp-section">
          <div class="sp-title">安全</div>
          ${pwSuccess ? html`
            <div style="padding:16px;background:var(--okg);border-radius:var(--rs);color:var(--ok);font-size:14px;text-align:center">
              密码已更新，请重新登录
            </div>
            <button class="logout-btn" style="margin-top:8px" onClick=${handleLogout}>重新登录</button>
          ` : pwMode ? html`
            <div class="setting-group">
              <label>新密码</label>
              <div class="auth-field" style="margin-bottom:12px">
                <input type="password" placeholder="输入新密码" value=${pw}
                  onInput=${e => setPw(e.target.value)} autocomplete="new-password" />
              </div>
              <label>确认密码</label>
              <div class="auth-field" style="margin-bottom:12px">
                <input type="password" placeholder="再次输入新密码" value=${pwConfirm}
                  onInput=${e => setPwConfirm(e.target.value)} autocomplete="new-password"
                  onKeyDown=${e => { if (e.key === 'Enter') handleChangePw(); }} />
              </div>
              ${pwError ? html`<div style="color:var(--err);font-size:13px;margin-bottom:8px">${pwError}</div>` : null}
              <button class="auth-btn" disabled=${pwLoading} onClick=${handleChangePw}>
                ${pwLoading ? html`<div class="spinner"></div>` : '保存密码'}
              </button>
              <button class="logout-btn" style="margin-top:8px" onClick=${() => { setPwMode(false); setPwError(''); setPw(''); setPwConfirm(''); }}>取消</button>
            </div>
          ` : html`
            <div class="menu-list">
              <div class="menu-item-row" onClick=${() => setPwMode(true)}>
                <div class="mi-icon" dangerouslySetInnerHTML=${raw(ICONS.settings)} />
                <div class="mi-label">修改密码</div>
                <div class="mi-arrow">></div>
              </div>
            </div>
          `}
        </div>

        <div class="sp-section">
          <div class="sp-title"><span dangerouslySetInnerHTML=${raw(ICONS.palette)} style="width:16px;height:16px;display:inline-flex" /> 外观主题</div>
          <div class="theme-group">
            <div class="theme-subtitle">主色调</div>
            <div class="swatch-grid">
              ${ACCENT_PRESETS.map(a => html`
                <div class=${'swatch' + (theme.accent === a.id && !theme.customAccent ? ' active' : '')}
                  title=${a.name} onClick=${() => {
                    const t = { accent: a.id, bg: theme.bg, customAccent: null };
                    setTheme(t); saveTheme(t);
                  }}>
                  <div class="dot" style=${`background:${a.hex}`} />
                </div>
              `)}
            </div>
            <div class="custom-color-row">
              <label>自定义颜色</label>
              <${ColorPicker} value=${getAccentHex(theme)}
                onChange=${(hex) => {
                  const t = { accent: theme.accent, bg: theme.bg, customAccent: hex };
                  setTheme(t); saveTheme(t);
                }} />
            </div>
          </div>
          <div class="theme-group">
            <div class="theme-subtitle">背景配色</div>
            <div style="display:flex;flex-direction:column;gap:8px">
              ${BG_PRESETS.map(b => html`
                <div class=${'bg-swatch' + (theme.bg === b.id ? ' active' : '')}
                  onClick=${() => {
                    const t = { accent: theme.accent, bg: b.id, customAccent: theme.customAccent };
                    setTheme(t); saveTheme(t);
                  }}>
                  <div class="bg-preview" style=${`background:linear-gradient(135deg, ${b.bg2}, ${b.bg})`} />
                  <div class="bg-name">${b.name}</div>
                </div>
