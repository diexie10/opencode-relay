<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141416">
<meta name="referrer" content="no-referrer">
<title>OpenCode Relay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════
   SoftGlass Design System — Dark Theme
   Fusion: Neumorphism (soft dual-shadows) + Liquid Glass (frosted translucency)
   ═══════════════════════════════════════════════════════════════════ */

/* ── Design Tokens ─────────────────────────────────────────────── */
:root{
  /* Accent */
  --p:#D97757;--pd:#b26247;--pdim:rgba(217,119,87,.14);--pglow:rgba(217,119,87,.28);
  /* Dark surfaces */
  --bg:#141416;--bg2:#1d1d20;--sf:rgba(255,255,255,.04);--sf2:rgba(255,255,255,.02);
  /* Text */
  --t1:#f4f4f5;--t2:#a1a1aa;--t3:#71717a;--sand:#3a3a3e;
  --s3:rgba(255,255,255,.03);--s4:rgba(255,255,255,.04);--s5:rgba(255,255,255,.05);--s6:rgba(255,255,255,.06);
  /* Status */
  --ok:#6B8F71;--okd:#5A7A61;--okg:rgba(107,143,113,.24);--err:#C75B5B;--errd:#a04848;
  --sh:rgba(0,0,0,.5);
  /* Neumorphism shadow tokens (dark mode) */
  --nL:rgba(255,255,255,.04);--nL2:rgba(255,255,255,.02);
  --nD:rgba(0,0,0,.5);--nD2:rgba(0,0,0,.3);
  --nLs:-5px -5px 12px var(--nL);--nLs2:-2px -2px 5px var(--nL2);
  --nDs:5px 5px 12px var(--nD);--nDs2:2px 2px 5px var(--nD2);
  --nLi:inset 4px 4px 10px var(--nD);--nLi2:inset -4px -4px 10px var(--nL);
  --nLis:inset 2px 2px 5px var(--nD2);--nLis2:inset -2px -2px 5px var(--nL2);
  /* Glass */
  --gBg:rgba(255,255,255,.04);--gBrd:rgba(255,255,255,.08);
  /* Component surfaces (dark-mode-specific, overridden in light theme) */
  --bar-glass:rgba(20,20,22,.7);--panel-glass:rgba(29,29,32,.85);--settings-glass:rgba(20,20,22,.88);
  --spnav-glass:rgba(20,20,22,.8);--dd-glass:rgba(28,28,32,.82);--toast-glass:rgba(29,29,32,.9);
  --bar-grad1:#232327;--bar-grad2:#1a1a1e;
  --btn-bg:#35353c;--btn-bg-hover:#404048;--btn-brd:rgba(255,255,255,.08);
  /* Fonts */
  --fd:'Space Grotesk',Georgia,serif;--fb:-apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif;--fm:'JetBrains Mono','SF Mono',monospace;
  /* Radii */
  --rs:12px;--rm:16px;--rl:22px;--rx:28px;--rf:9999px;
  /* Easing */
  --sp:cubic-bezier(.34,1.56,.64,1);--sm:cubic-bezier(.32,.72,0,1);--eo:cubic-bezier(.25,.46,.45,.94);
  --t:.3s cubic-bezier(.4,0,.2,1);--spring:.45s cubic-bezier(.34,1.56,.64,1);
  /* Layout */
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --header-h:52px;
}

/* ── Light Theme Overrides ─────────────────────────────────────── */
[data-theme="light"]{
  --nL:rgba(255,255,255,.85);--nL2:rgba(255,255,255,.5);
  --nD:rgba(160,130,100,.22);--nD2:rgba(160,130,100,.12);
  --t1:#2a2a30;--t2:#6b6b75;--t3:#9a9aa5;--sand:#d0d0d5;
  --s3:rgba(0,0,0,.03);--s4:rgba(0,0,0,.04);--s5:rgba(0,0,0,.05);--s6:rgba(0,0,0,.06);
  --sf:rgba(0,0,0,.03);--sf2:rgba(0,0,0,.015);
  --gBg:rgba(255,255,255,.5);--gBrd:rgba(0,0,0,.08);
  --bar-glass:rgba(240,240,243,.8);--panel-glass:rgba(247,247,250,.92);--settings-glass:rgba(240,240,243,.92);
  --spnav-glass:rgba(240,240,243,.85);--dd-glass:rgba(250,250,253,.92);--toast-glass:rgba(247,247,250,.95);
  --bar-grad1:#F4F4F7;--bar-grad2:#E8E8EC;
  --btn-bg:#E4E4E8;--btn-bg-hover:#D8D8DE;--btn-brd:rgba(0,0,0,.06);
}
[data-theme="light"] body{background:radial-gradient(120% 90% at 50% 0%,#F7F7FA 0%,#EDEDF0 100%)}
[data-theme="light"] .msg.assistant .msg-bubble{box-shadow:-2px -2px 6px var(--nL),2px 2px 6px var(--nD)}
[data-theme="light"] .input-bar:focus-within{border-color:rgba(0,0,0,.12);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 24px 60px -22px rgba(0,0,0,.2)}
[data-theme="light"] .input-bar{box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px -16px rgba(0,0,0,.25)}
[data-theme="light"] .sidebar-overlay{background:rgba(0,0,0,.15)}
[data-theme="light"] .dropdown-menu{box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 16px 40px -12px rgba(0,0,0,.25)}
[data-theme="light"] .modal-overlay{background:rgba(0,0,0,.25)}
[data-theme="light"] .toast{box-shadow:0 4px 16px rgba(0,0,0,.15)}

/* ── Reset / Base ──────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit}
::selection{background:var(--pdim)}
html,body{height:100%;width:100%;overflow:hidden}
body{
  font-family:var(--fb);color:var(--t1);
  background:radial-gradient(120% 90% at 50% 0%,#1e1e22 0%,var(--bg2) 45%,var(--bg) 100%);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
#app{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative;max-width:720px;margin:0 auto}

/* ── Ambient Orbs ─────────────────────────────────────────────── */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(48px)}
.orb-1{width:420px;height:420px;left:-80px;top:-60px;background:radial-gradient(circle,rgba(217,119,87,.10),transparent 70%);animation:orbDrift 22s ease-in-out infinite}
.orb-2{width:380px;height:380px;right:-60px;top:40px;background:radial-gradient(circle,rgba(107,143,113,.08),transparent 70%);animation:orbDrift2 26s ease-in-out infinite}
.orb-3{width:340px;height:340px;left:-30px;bottom:0;background:radial-gradient(circle,rgba(139,124,247,.06),transparent 70%);animation:orbDrift 30s ease-in-out infinite reverse}

/* ── Animations ───────────────────────────────────────────────── */
@keyframes eD{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes eU{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes eR{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes logoPing{0%{opacity:.6;transform:scale(.78)}55%,100%{opacity:0;transform:scale(1.32)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes gearSpin{to{transform:rotate(90deg)}}
@keyframes itemPop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes fi{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
@keyframes msgInU{from{opacity:0;transform:translateY(12px) scaleY(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes msgInA{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes btnSuccess{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes rippleOut{from{width:0;height:0;opacity:1}to{width:120px;height:120px;opacity:0;transform:translate(-50%,-50%)}}
@keyframes orbDrift{0%,100%{transform:translate(0,0) scale(1);opacity:.4}33%{transform:translate(-50px,40px) scale(1.15);opacity:.7}66%{transform:translate(25px,-25px) scale(.9);opacity:.2}}
@keyframes orbDrift2{0%,100%{transform:translate(0,0) scale(1);opacity:.3}50%{transform:translate(40px,-30px) scale(1.2);opacity:.5}}
@keyframes welcomeIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes sparklePulse{0%,100%{filter:drop-shadow(0 0 4px var(--pglow));transform:scale(1)}50%{filter:drop-shadow(0 0 10px var(--pglow));transform:scale(1.12)}}
@keyframes itemIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes dirBadgeIn{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes chipIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

/* ── Neumorphism / Glass Helpers ──────────────────────────────── */
.neu-raised{background:var(--bg2);box-shadow:var(--nLs),var(--nDs),var(--nLs2),var(--nDs2)}
.neu-raised-sm{background:var(--bg2);box-shadow:-3px -3px 8px var(--nL),3px 3px 8px var(--nD),-1px -1px 3px var(--nL2),1px 1px 3px var(--nD2)}
.neu-inset{background:var(--bg2);box-shadow:var(--nLi),var(--nLi2),var(--nLis),var(--nLis2)}
.neu-inset-sm{background:var(--bg2);box-shadow:inset 3px 3px 7px var(--nD),inset -3px -3px 7px var(--nL)}
.glass{position:relative;background:var(--gBg);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--gBrd);box-shadow:0 8px 32px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,255,255,.05)}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.01) 20%,transparent 45%)}

/* ── Elastic Overscroll (rubber-band) ─────────────────────────── */
.scroll-area{overscroll-behavior-y:contain;-webkit-overscroll-behavior-y:contain}

/* ═══════════════════════════════════════════════════════════════
   Login / Setup Pages
   ═══════════════════════════════════════════════════════════════ */
.auth-page{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:radial-gradient(120% 90% at 50% 0%,#1e1e22 0%,var(--bg2) 45%,var(--bg) 100%)}
.auth-card{width:100%;max-width:360px;padding:36px 28px;border-radius:var(--rl);background:var(--bg2);box-shadow:var(--nLs),var(--nDs),var(--nLs2),var(--nDs2),inset 0 1px 1px rgba(255,255,255,.04);animation:welcomeIn .6s var(--sp) both;position:relative}
.auth-logo{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;position:relative}
.auth-logo svg{width:100%;height:100%}
.auth-logo::after{content:'';position:absolute;border:2px solid var(--p);border-radius:20px;opacity:0;animation:logoPing 3s ease-out infinite;inset:-6px}
.auth-title{font-family:var(--fd);font-weight:700;font-size:22px;letter-spacing:-.4px;text-align:center;margin-bottom:6px}
.auth-subtitle{font-size:13px;color:var(--t3);text-align:center;margin-bottom:28px}
.auth-field{position:relative;margin-bottom:16px}
.auth-field input{width:100%;padding:14px 44px 14px 16px;border:none;border-radius:var(--rs);background:var(--bg);color:var(--t1);font-size:15px;outline:none;box-shadow:var(--nLi),var(--nLi2);transition:box-shadow var(--t)}
.auth-field input:focus{box-shadow:var(--nLi),var(--nLi2),0 0 0 2px var(--pglow)}
.auth-field input::placeholder{color:var(--t3)}
.auth-field .pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:var(--rf);display:flex;align-items:center;justify-content:center;color:var(--t3);transition:color .2s}
.auth-field .pw-toggle:hover{color:var(--t1)}
.auth-field .pw-toggle svg{width:18px;height:18px;fill:currentColor}
.auth-error{color:var(--err);font-size:13px;margin-bottom:12px;display:none;animation:fi .2s ease-out}
.auth-error.show{display:block}
.auth-btn{width:100%;padding:14px;border:none;border-radius:var(--rs);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--sp),box-shadow var(--t),filter .2s;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;box-shadow:var(--nLs),var(--nDs),inset 1px 1px 2px rgba(255,255,255,.15),0 4px 14px var(--pglow)}
.auth-btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.auth-btn:active{transform:scale(.96);box-shadow:var(--nLi),var(--nLi2)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.auth-btn .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-success{text-align:center;display:none;animation:fi .3s ease-out}
.auth-success.show{display:block}
.auth-success .check-circle{width:56px;height:56px;border-radius:50%;background:var(--okg);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.auth-success .check-circle svg{width:28px;height:28px;fill:var(--ok)}

/* ═══════════════════════════════════════════════════════════════
   Nav Bar
   ═══════════════════════════════════════════════════════════════ */
.nav-bar{position:relative;z-index:10;animation:eD .5s var(--eo) .08s both;padding:calc(10px + var(--safe-top)) 16px 10px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;background:var(--bar-glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--gBrd)}
.nav-bar .left{display:flex;align-items:center;gap:12px}
.nav-bar .menu-btn,.nav-bar .actions button{background:var(--bg2);border:none;border-radius:var(--rf);display:flex;align-items:center;justify-content:center;box-shadow:-3px -3px 7px var(--nL),3px 3px 7px var(--nD),-1px -1px 2px var(--nL2),1px 1px 2px var(--nD2);transition:box-shadow var(--t),color .2s,transform .15s var(--sp)}
.nav-bar .menu-btn{color:var(--t1);width:38px;height:38px}
.nav-bar .menu-btn:active{transform:scale(.86);box-shadow:var(--nLi),var(--nLi2)}
.nav-bar .menu-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.nav-bar .brand{display:flex;align-items:center;gap:10px}
.nav-bar .brand .logo{background:transparent;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;width:28px;height:28px;border-radius:8px}
.nav-bar .brand .logo svg{width:100%;height:100%}
.nav-bar .brand .logo::after{content:'';position:absolute;border:1.5px solid var(--p);border-radius:12px;opacity:0;animation:logoPing 3.2s ease-out infinite;inset:-4px}
.nav-bar .brand .name{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:-.3px}
.nav-bar .brand .badge{background:var(--pdim);color:var(--p);font-family:var(--fm);font-size:9px;font-weight:700;padding:3px 10px;border-radius:var(--rf);text-transform:uppercase;letter-spacing:.06em;display:inline-flex;align-items:center;gap:5px;transition:background .3s,color .3s;opacity:.7}
.nav-bar .brand .badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 2s ease-in-out infinite}
.nav-bar .actions{display:flex;gap:4px}
.nav-bar .actions button{color:var(--t2);width:36px;height:36px}
.nav-bar .actions button:active{transform:scale(.86);box-shadow:var(--nLi),var(--nLi2)}
.nav-bar .actions button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.nav-bar .actions .settings-btn{color:var(--t3);opacity:.6}
.nav-bar .actions .settings-btn:active svg{animation:gearSpin .6s var(--sp)}

/* Status indicator */
.status-indicator{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);padding:0 4px;opacity:.6}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--t3);transition:background .3s,box-shadow .3s}
.status-dot.connecting{background:var(--p);box-shadow:0 0 8px var(--pglow);animation:blink 1.2s ease-in-out infinite}
.status-dot.connected{background:var(--ok);box-shadow:0 0 6px var(--okg)}
.status-dot.error{background:var(--err);box-shadow:0 0 6px rgba(199,91,91,.4)}
.status-dot.reconnecting{background:var(--p);animation:blink 1.5s ease-in-out infinite}

/* ═══════════════════════════════════════════════════════════════
   Sidebar
   ═══════════════════════════════════════════════════════════════ */
.sidebar-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .35s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:100}
.sidebar-overlay.open{opacity:1;pointer-events:auto}
.sidebar{position:absolute;top:0;left:0;bottom:0;width:84%;max-width:320px;background:var(--panel-glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);z-index:101;transform:translateX(-102%);transition:transform .4s var(--sm);display:flex;flex-direction:column;box-shadow:4px 0 40px rgba(0,0,0,.4),inset 1px 0 0 var(--gBrd);border-radius:0 var(--rx) var(--rx) 0}
.sidebar.open{transform:translateX(0)}
.sidebar-header{display:flex;justify-content:space-between;align-items:center;padding:20px 18px 14px;border-bottom:1px solid var(--gBrd)}
.sidebar-header h3{font-family:var(--fd);font-size:18px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.sidebar-header h3::before{content:'';width:8px;height:8px;border-radius:3px;background:var(--p);box-shadow:0 0 10px var(--pglow)}
.sidebar-actions{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--gBrd)}
.sidebar-actions button{flex:1;padding:10px 0;border-radius:var(--rs);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;transition:box-shadow var(--t),transform .15s var(--sp),filter .2s}
.sidebar-actions button:active{transform:scale(.94);box-shadow:var(--nLi),var(--nLi2)}
.sidebar-actions .primary{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;box-shadow:-3px -3px 8px var(--nL),3px 3px 8px var(--nD),inset 1px 1px 2px rgba(255,255,255,.15),0 4px 14px var(--pglow)}
.sidebar-actions .primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.sidebar-actions .secondary{background:var(--bg2);color:var(--t2);box-shadow:-2px -2px 5px var(--nL),2px 2px 5px var(--nD)}
.sidebar-actions button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.sidebar-header .close-btn{background:var(--bg2);color:var(--t3);border-radius:var(--rf);display:flex;align-items:center;justify-content:center;box-shadow:-2px -2px 5px var(--nL),2px 2px 5px var(--nD);transition:box-shadow var(--t),transform .25s var(--sp),color .2s;width:30px;height:30px}
.sidebar-header .close-btn:hover{color:var(--p)}
.sidebar-header .close-btn:active{transform:rotate(90deg) scale(.86);box-shadow:var(--nLi),var(--nLi2)}
.sidebar-header .close-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* Directory selector */
.dir-section{padding:12px 14px 14px;border-bottom:1px solid var(--gBrd)}
.dir-label{font-size:10px;color:var(--t3);margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--fm);font-weight:700;opacity:.7;display:flex;align-items:center;gap:6px}
.dir-label::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--p);opacity:.6}
.dir-chips{display:flex;gap:6px;flex-wrap:wrap}
.dir-chip{cursor:pointer;font-size:12px;padding:6px 13px;border-radius:var(--rf);background:var(--bg2);color:var(--t2);border:none;transition:box-shadow .25s var(--eo),color .2s,transform .2s var(--sp);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;box-shadow:-2px -2px 5px var(--nL),2px 2px 5px var(--nD);animation:chipIn .3s var(--sp) both}
.dir-chip:hover{color:var(--t1);box-shadow:-3px -3px 8px var(--nL),3px 3px 8px var(--nD);transform:translateY(-1px)}
.dir-chip:active{transform:scale(.95);box-shadow:var(--nLi),var(--nLi2)}
.dir-chip.active{background:var(--bg2);color:var(--p);box-shadow:inset 3px 3px 7px var(--nD),inset -3px -3px 7px var(--nL),0 0 0 1px var(--pglow)}

/* Session list */
.session-list{flex:1;overflow-y:auto;padding:8px 12px 16px;overscroll-behavior-y:contain}
.session-list::-webkit-scrollbar{width:3px}
.session-list::-webkit-scrollbar-thumb{background:var(--sand);border-radius:10px}
.session-item{display:flex;align-items:center;gap:10px;padding:10px 8px 10px 11px;border-radius:var(--rs);cursor:pointer;transition:box-shadow .2s,transform .15s var(--sp);margin-bottom:2px;animation:eR .4s var(--eo) both}
.session-item:active{transform:scale(.96);box-shadow:var(--nLi),var(--nLi2)}
.session-item.active{background:var(--s5);box-shadow:var(--nLi),var(--nLi2),inset 0 0 0 1px var(--pglow);animation:itemPop .3s var(--sp)}
.session-item:hover{box-shadow:-2px -2px 5px var(--nL),2px 2px 5px var(--nD)}
.session-item .si-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg);box-shadow:-1px -1px 3px var(--nL),1px 1px 3px var(--nD)}
.session-item .si-icon svg{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:2}
.session-item.active .si-icon svg{stroke:var(--p)}
.session-item .si-info{flex:1;min-width:0}
.session-item .si-title{font-size:13px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-item.active .si-title{font-weight:600}
.session-item .si-meta{font-size:10px;color:var(--t3);margin-top:2px;font-family:var(--fm)}
.session-item .si-meta .count{background:var(--s5);padding:1px 6px;border-radius:10px}
.session-item .del-btn{background:transparent;color:var(--t3);padding:4px;border-radius:6px;opacity:0;transition:opacity .2s,color .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.session-item:hover .del-btn{opacity:.5}
.session-item .del-btn:hover{opacity:1;color:var(--err)}
.session-item .del-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* Sidebar import section */
.sidebar-import{flex-shrink:0;border-top:1px solid var(--gBrd);padding:12px 14px 16px;max-height:45%;overflow-y:auto;overscroll-behavior-y:contain}
.sidebar-import::-webkit-scrollbar{width:3px}
.sidebar-import::-webkit-scrollbar-thumb{background:var(--sand);border-radius:10px}
.si-import-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:8px;letter-spacing:.02em}
.si-import-title svg{width:14px;height:14px;stroke:var(--p);fill:none;stroke-width:2}
.si-import-err{color:var(--err);font-size:11px;margin-top:5px}
.si-desktop-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.si-desktop-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--rs);background:var(--bg2);box-shadow:-1px -1px 4px var(--nL),1px 1px 4px var(--nD);transition:box-shadow .2s}
.si-desktop-item:hover{box-shadow:-2px -2px 6px var(--nL),2px 2px 6px var(--nD)}
.si-desktop-item.is-project{border-left:2px solid var(--p)}
.si-desktop-info{flex:1;min-width:0}
.si-desktop-name{font-size:12px;color:var(--t1);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.si-badge{flex:none;font-size:9px;padding:1px 5px;border-radius:4px;background:var(--p);color:#fff;font-weight:600;letter-spacing:.02em;line-height:1.4}
.si-badge-oc{background:var(--ok)}
.si-desktop-path{font-size:10px;color:var(--t3);font-family:var(--fm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.si-subdirs{margin-left:12px;display:flex;flex-direction:column;gap:2px;padding:2px 0 4px}
.si-subdir-item{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;background:var(--bg);transition:background .15s}
.si-subdir-item:hover{background:var(--bg2)}
.si-subdir-name{flex:1;font-size:11px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si-import-tiny{padding:2px 8px;font-size:10px;min-width:34px;height:20px;border-radius:6px}
.si-no-dirs{font-size:11px;color:var(--t3);text-align:center;padding:12px 0}
.si-import-mini-btn{flex:none;padding:4px 12px;border-radius:8px;background:var(--p);border:none;color:#fff;font-size:11px;font-weight:600;cursor:pointer;transition:background .2s,transform .15s var(--sp);display:flex;align-items:center;justify-content:center;min-width:44px;height:26px}
.si-import-mini-btn:hover{background:var(--pd)}
.si-import-mini-btn:active{transform:scale(.92)}
.si-import-mini-btn:disabled{background:var(--btn-bg);color:var(--t3);cursor:not-allowed}
.si-imported-list{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.si-imported-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--bg);box-shadow:inset 2px 2px 5px var(--nD),inset -2px -2px 5px var(--nL)}
.si-imported-info{flex:1;min-width:0}
.si-imported-name{font-size:12px;color:var(--ok);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si-delete-mini-btn{flex:none;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;color:var(--t3);transition:color .15s,transform .15s var(--sp);border:none}
.si-delete-mini-btn:hover{color:var(--err)}
.si-delete-mini-btn:active{transform:scale(.88)}
.si-delete-mini-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}

/* ═══════════════════════════════════════════════════════════════
   Chat Area
   ═══════════════════════════════════════════════════════════════ */
.chat-area{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1;overscroll-behavior-y:contain;-webkit-overscroll-behavior-y:contain;scroll-behavior:smooth}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:var(--sand);border-radius:10px}
.chat-area::-webkit-scrollbar-thumb:hover{background:var(--t3)}

.chat-messages{padding:16px 12px 8px;display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto;width:100%}

/* Welcome card */
.welcome-card{text-align:center;padding:48px 24px;animation:welcomeIn .6s var(--sp) both}
.welcome-card .wc-logo{width:68px;height:68px;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;position:relative;background:var(--bg2);box-shadow:-5px -5px 14px var(--nL),5px 5px 14px var(--nD),-2px -2px 5px var(--nL2),2px 2px 5px var(--nD2);animation:logoFloat 5s var(--eo) .4s infinite}
.welcome-card .wc-logo svg{width:58%;height:58%}
.welcome-card .wc-logo::after{content:'';position:absolute;border:1.5px solid var(--p);border-radius:26px;opacity:0;animation:logoPing 3s ease-out 1.6s infinite;inset:-10px}
.welcome-card .wc-title{font-family:var(--fd);font-size:23px;font-weight:700;letter-spacing:-.5px;margin-bottom:16px;animation:fi .5s var(--eo) .12s both}
.welcome-card .wc-dir-badge{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:var(--rf);background:var(--bg2);color:var(--t2);font-size:13px;font-weight:500;max-width:280px;margin-bottom:18px;box-shadow:inset 3px 3px 7px var(--nD),inset -3px -3px 7px var(--nL);animation:dirBadgeIn .5s var(--sp) .22s both;transition:box-shadow .3s var(--eo)}
.welcome-card .wc-dir-badge:hover{box-shadow:inset 4px 4px 9px var(--nD),inset -4px -4px 9px var(--nL)}
.welcome-card .wc-dir-badge svg{width:15px;height:15px;stroke:var(--p);fill:none;stroke-width:2;flex:none;filter:drop-shadow(0 0 4px var(--pglow))}
.welcome-card .wc-dir-badge .dir-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--fm);letter-spacing:.02em}
.welcome-card .wc-subtitle{font-size:13.5px;color:var(--t3);line-height:1.65;max-width:300px;margin:0 auto;animation:fi .5s var(--eo) .32s both}

/* Messages */
.msg{animation:msgInA .3s var(--eo) both;content-visibility:auto;contain-intrinsic-size:auto 80px}
.msg.user{align-self:flex-end;max-width:85%}
.msg.assistant{align-self:flex-start;max-width:92%}
.msg.tool{align-self:flex-start;max-width:92%}
.msg-bubble{padding:12px 16px;border-radius:var(--rm);font-size:14.5px;line-height:1.65;word-break:break-word;position:relative}
.msg.user .msg-bubble{background:linear-gradient(135deg,rgba(217,119,87,.15),rgba(178,98,71,.10));color:var(--t1);border:1px solid rgba(217,119,87,.15);border-bottom-right-radius:6px}
.msg.assistant .msg-bubble{background:var(--bg2);color:var(--t1);box-shadow:-2px -2px 6px var(--nL),2px 2px 6px var(--nD);border-bottom-left-radius:6px}

/* Streaming cursor */
.streaming-cursor::after{content:'';display:inline-block;width:8px;height:16px;background:var(--p);border-radius:2px;margin-left:2px;vertical-align:text-bottom;animation:cursorBlink 1s step-end infinite}

/* Typing indicator */
.typing-dots{display:flex;gap:4px;padding:4px 0}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:var(--t3);animation:blink 1.4s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}

/* ═══════════════════════════════════════════════════════════════
   Reasoning Blocks
   ═══════════════════════════════════════════════════════════════ */
.reasoning-block{margin-bottom:10px;border-radius:var(--rs);overflow:hidden;background:var(--bg);border:1px solid var(--gBrd)}
.reasoning-block[open]{background:var(--bg)}
.reasoning-summary{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:12px;color:var(--t3);font-weight:500;user-select:none;list-style:none;transition:background .15s}
.reasoning-summary::-webkit-details-marker{display:none}
.reasoning-summary:hover{background:var(--s4)}
.reasoning-summary svg{width:14px;height:14px;stroke:var(--t3);fill:none;stroke-width:2;flex-shrink:0;transition:transform .3s var(--sp)}
.reasoning-block[open] .reasoning-summary svg{transform:rotate(90deg)}
.reasoning-summary .rs-label{flex:1}
.reasoning-summary .rs-badge{font-family:var(--fm);font-size:9px;padding:2px 7px;border-radius:var(--rf);background:var(--pdim);color:var(--p);text-transform:uppercase;letter-spacing:.04em;opacity:.7}
.reasoning-content{padding:0 12px 12px;font-size:13px;color:var(--t2);line-height:1.6;overflow-x:auto}
.reasoning-content > :first-child{margin-top:0}
.reasoning-content > :last-child{margin-bottom:0}
.reasoning-content p{margin-bottom:6px}
.reasoning-content code{font-family:var(--fm);font-size:12px;background:var(--s6);padding:1px 5px;border-radius:4px}

/* ═══════════════════════════════════════════════════════════════
   Tool Calls
   ═══════════════════════════════════════════════════════════════ */
.tool-call{border-radius:var(--rs);overflow:hidden;background:var(--bg);border:1px solid var(--gBrd);margin-bottom:8px}
.tool-header{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:12px;color:var(--t2);user-select:none;transition:background .15s}
.tool-header:hover{background:var(--s4)}
.tool-header svg{width:14px;height:14px;stroke:var(--t3);fill:none;stroke-width:2;flex-shrink:0;transition:transform .3s var(--sp)}
.tool-header.open svg{transform:rotate(90deg)}
.tool-header .tool-name{flex:1;font-family:var(--fm);font-weight:500;color:var(--t2)}
.tool-header .tool-badge{font-family:var(--fm);font-size:9px;padding:2px 7px;border-radius:var(--rf);background:var(--s5);color:var(--t3);text-transform:uppercase;letter-spacing:.04em;opacity:.7}
.tool-body{max-height:0;overflow:hidden;transition:max-height .3s var(--sm);font-family:var(--fm);font-size:11.5px;color:var(--t3);line-height:1.5}
.tool-body.open{max-height:400px;overflow-y:auto;padding:0 12px 10px}
.tool-body::-webkit-scrollbar{width:3px}
.tool-body::-webkit-scrollbar-thumb{background:var(--sand);border-radius:10px}
.tool-body pre{white-space:pre-wrap;word-break:break-all}

/* ═══════════════════════════════════════════════════════════════
   Markdown Content
   ═══════════════════════════════════════════════════════════════ */
.md-content{font-size:14.5px;line-height:1.65;color:var(--t1)}
.md-content > :first-child{margin-top:0}
.md-content > :last-child{margin-bottom:0}
.md-content p{margin-bottom:10px}
.md-content h1,.md-content h2,.md-content h3,.md-content h4,.md-content h5,.md-content h6{font-family:var(--fd);font-weight:700;margin:16px 0 8px;line-height:1.3}
.md-content h1{font-size:20px}
.md-content h2{font-size:17px}
.md-content h3{font-size:15px}
.md-content h4{font-size:14px}
.md-content ul,.md-content ol{margin-bottom:10px;padding-left:22px}
.md-content li{margin-bottom:4px}
.md-content a{color:var(--p);text-decoration:none;border-bottom:1px solid rgba(217,119,87,.3)}
.md-content a:hover{border-bottom-color:var(--p)}
.md-content blockquote{border-left:3px solid var(--p);padding:4px 14px;margin:10px 0;background:var(--pdim);border-radius:0 var(--rs) var(--rs) 0;color:var(--t2)}
.md-content code{font-family:var(--fm);font-size:13px;background:var(--s6);padding:1px 5px;border-radius:4px}
.md-content pre{background:var(--bg);border:1px solid var(--gBrd);border-radius:var(--rs);padding:12px 14px;overflow-x:auto;margin:10px 0;position:relative}
.md-content pre code{background:transparent;padding:0;font-size:12.5px;line-height:1.5;color:var(--t2)}
.md-content pre::-webkit-scrollbar{height:4px}
.md-content pre::-webkit-scrollbar-thumb{background:var(--sand);border-radius:10px}
.md-content table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px}
.md-content th,.md-content td{border:1px solid var(--gBrd);padding:6px 10px;text-align:left}
.md-content th{background:var(--s5);font-weight:600}
.md-content hr{border:none;border-top:1px solid var(--gBrd);margin:14px 0}
.md-content img{max-width:100%;border-radius:var(--rs)}

/* Code copy button */
.code-block-wrapper{position:relative}
.code-copy-btn{position:absolute;top:8px;right:8px;padding:4px 8px;border-radius:6px;background:var(--s5);color:var(--t3);font-size:11px;font-family:var(--fm);opacity:0;transition:opacity .2s,background .15s;display:flex;align-items:center;gap:4px}
.md-content pre:hover .code-copy-btn{opacity:1}
.code-copy-btn:hover{background:var(--s6);color:var(--t1)}
.code-copy-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}

/* ═══════════════════════════════════════════════════════════════
   Input Bar (from ai-chat-input reference, adapted)
   ═══════════════════════════════════════════════════════════════ */
.input-area{flex-shrink:0;padding:8px 12px calc(10px + var(--safe-bottom));position:relative;z-index:5;background:var(--bar-glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--gBrd)}
.input-bar{position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--bar-grad1) 0%,var(--bar-grad2) 100%);border:1px solid var(--gBrd);border-radius:var(--rl);padding:12px 12px 10px 14px;gap:8px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 20px 50px -20px rgba(0,0,0,.7);transition:border-color .25s var(--eo),box-shadow .25s var(--eo);max-width:680px;margin:0 auto;width:100%}
.input-bar:focus-within{border-color:rgba(255,255,255,.14);box-shadow:0 0 0 1px rgba(255,255,255,.10),0 24px 60px -22px rgba(0,0,0,.8)}
.input-bar textarea{width:100%;font-size:14.5px;color:var(--t1);background:transparent;border:none;outline:none;resize:none;line-height:1.5;max-height:140px;min-height:24px;font-family:var(--fb)}
.input-bar textarea::placeholder{color:var(--t3)}
.input-controls{display:flex;align-items:center;gap:8px;justify-content:space-between}
.input-controls .left{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0}
.input-controls .right{display:flex;align-items:center;gap:8px;flex:none}

/* Circular add button (expands on hover) */
.add-btn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--btn-bg);border:1px solid var(--btn-brd);color:var(--t1);display:inline-flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;white-space:nowrap;transition:width .28s var(--eo),border-radius .28s var(--eo),background .2s var(--eo),border-color .2s var(--eo)}
.add-btn:hover{width:auto;min-width:118px;border-radius:var(--rf);background:var(--btn-bg-hover);border-color:var(--btn-brd)}
.add-btn svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:2}
.add-btn .label{font-size:13px;font-weight:500;opacity:0;transform:translateX(-4px);transition:opacity .2s var(--eo) .05s,transform .25s var(--sp) .05s}
.add-btn:hover .label{opacity:1;transform:translateX(0)}

/* Circular icon button */
.icon-btn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--btn-bg);border:1px solid var(--btn-brd);color:var(--t1);display:grid;place-items:center;transition:transform .2s var(--sp),background .2s var(--eo),border-color .2s var(--eo),opacity .2s}
.icon-btn:hover{background:var(--btn-bg-hover);border-color:var(--btn-brd);transform:scale(1.06)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.icon-btn.send-btn{background:var(--p);border-color:transparent;color:#fff}
.icon-btn.send-btn:hover{background:var(--pd);transform:scale(1.06)}
.icon-btn.send-btn:disabled{background:var(--btn-bg);color:var(--t3);opacity:.5;cursor:not-allowed;transform:none}
.icon-btn.stop-btn{background:var(--err);border-color:transparent;color:#fff;opacity:.85}
.icon-btn.stop-btn:hover{background:var(--errd)}

/* Pill dropdown buttons */
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;background:var(--btn-bg);border:1px solid var(--btn-brd);color:var(--t1);font-size:13px;font-weight:500;border-radius:var(--rf);cursor:pointer;transition:background .2s var(--eo),border-color .2s var(--eo),transform .2s var(--sp);white-space:nowrap;max-width:160px;overflow:hidden}
.pill:hover{background:var(--btn-bg-hover);border-color:var(--btn-brd)}
.pill:active{transform:scale(.96)}
.pill[aria-expanded="true"]{background:var(--btn-bg-hover);border-color:var(--btn-brd)}
.pill .pill-label{overflow:hidden;text-overflow:ellipsis}
.pill .chev{transition:transform .25s var(--eo);opacity:.5;flex:none}
.pill[aria-expanded="true"] .chev{transform:rotate(180deg)}
.pill svg.chev{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* Sparkle icon */
.sparkle{flex:none;width:26px;height:26px;display:grid;place-items:center;color:var(--p);filter:drop-shadow(0 0 6px var(--pglow));animation:sparklePulse 2.6s var(--eo) infinite}
.sparkle svg{width:16px;height:16px;fill:currentColor}

/* ═══════════════════════════════════════════════════════════════
   Dropdown Menus (frosted glass)
   ═══════════════════════════════════════════════════════════════ */
.dropdown-menu{position:fixed;z-index:200;background:var(--dd-glass);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--gBrd);border-radius:var(--rm);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 30px 60px -20px rgba(0,0,0,.75);padding:6px;opacity:0;transform:translateY(-6px) scale(.96);pointer-events:none;transition:opacity .22s var(--eo),transform .22s var(--sp);max-height:320px;overflow-y:auto;overscroll-behavior-y:contain}
.dropdown-menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.dropdown-menu::-webkit-scrollbar{width:3px}
.dropdown-menu::-webkit-scrollbar-thumb{background:var(--sand);border-radius:10px}

.menu-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:13.5px;color:var(--t1);cursor:pointer;position:relative;transition:background .15s var(--eo),color .15s var(--eo);animation:itemIn .34s var(--eo) both}
.menu-item:hover{background:rgba(255,255,255,.06)}
.menu-item.selected{color:var(--t1)}
.menu-item .mi-text{flex:1;min-width:0}
.menu-item .mi-text .mi-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-item .mi-text .mi-desc{font-size:11px;color:var(--t3);margin-top:1px}
.menu-item .mi-check{margin-left:auto;opacity:0;transform:scale(.5);transition:opacity .2s var(--eo),transform .25s var(--sp);color:var(--p);flex:none}
.menu-item.selected .mi-check{opacity:1;transform:scale(1)}
.menu-item .mi-check svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5}
.menu-item .mi-icon{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center}
.menu-item .mi-icon svg{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:2}
.menu-item:nth-child(1){animation-delay:.02s}
.menu-item:nth-child(2){animation-delay:.06s}
.menu-item:nth-child(3){animation-delay:.10s}
.menu-item:nth-child(4){animation-delay:.14s}
.menu-item:nth-child(5){animation-delay:.18s}
.menu-item:nth-child(6){animation-delay:.22s}
.menu-item:nth-child(7){animation-delay:.26s}

/* Menu search */
.menu-search{padding:6px 8px 8px;border-bottom:1px solid var(--gBrd);margin-bottom:4px}
.menu-search input{width:100%;padding:7px 10px 7px 32px;border-radius:8px;background:var(--bg);border:1px solid var(--gBrd);color:var(--t1);font-size:13px;outline:none}
.menu-search input:focus{border-color:var(--pglow)}
.menu-search input::placeholder{color:var(--t3)}
.menu-search{position:relative}
.menu-search .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--t3);fill:none;stroke-width:2;pointer-events:none}

/* ═══════════════════════════════════════════════════════════════
   Settings Panel
   ═══════════════════════════════════════════════════════════════ */
.settings-panel{position:fixed;inset:0;z-index:9998;background:var(--settings-glass);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);overflow-y:auto;opacity:0;visibility:hidden;transform:translateY(20px);transition:opacity .35s var(--eo),visibility .35s,transform .35s var(--eo)}
.settings-panel.open{opacity:1;visibility:visible;transform:translateY(0)}
.settings-panel .sp-nav{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:calc(12px + var(--safe-top)) 16px 12px;background:var(--spnav-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--gBrd);z-index:10}
.settings-panel .sp-nav .back-btn{background:var(--bg2);color:var(--t2);width:34px;height:34px;border-radius:var(--rf);display:flex;align-items:center;justify-content:center;box-shadow:-3px -3px 7px var(--nL),3px 3px 7px var(--nD);transition:box-shadow var(--t),transform .15s var(--sp),color .2s;flex-shrink:0}
.settings-panel .sp-nav .back-btn:hover{color:var(--p)}
.settings-panel .sp-nav .back-btn:active{transform:scale(.86);box-shadow:var(--nLi),var(--nLi2)}
.settings-panel .sp-nav .back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.settings-panel .sp-nav h3{font-family:var(--fd);font-size:18px;font-weight:700;letter-spacing:-.3px;flex:1}
.settings-panel .sp-body{max-width:480px;margin:0 auto;padding:20px 18px calc(40px + var(--safe-bottom))}
.settings-panel .sp-section{margin-bottom:24px}
.settings-panel .sp-section .sp-title{font-family:var(--fd);font-size:14px;font-weight:700;color:var(--t1);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--gBrd);display:flex;align-items:center;gap:6px;opacity:.8}
.settings-panel .setting-group{margin-bottom:14px}
.settings-panel .setting-group label{display:block;font-family:var(--fm);font-size:10px;font-weight:700;color:var(--t3);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.settings-panel .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--bg2);border-radius:var(--rs);box-shadow:-3px -3px 7px var(--nL),3px 3px 7px var(--nD);transition:box-shadow var(--t)}
.settings-panel .toggle-row .tr-label{font-size:14px;font-weight:500;color:var(--t1)}
.settings-panel .toggle-row .tr-desc{font-size:11px;color:var(--t3);margin-top:2px}
.settings-panel .toggle-row .switch{position:relative;width:46px;height:26px;flex-shrink:0}
.settings-panel .toggle-row .switch input{opacity:0;width:0;height:0}
.settings-panel .toggle-row .switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--bg);border-radius:var(--rf);box-shadow:var(--nLi),var(--nLi2);transition:box-shadow .3s,background .3s}
.settings-panel .toggle-row .switch .slider::before{content:'';position:absolute;height:20px;width:20px;left:3px;top:3px;background:var(--bg2);border-radius:50%;box-shadow:-2px -2px 5px var(--nL),2px 2px 5px var(--nD);transition:transform .35s var(--spring),box-shadow .35s var(--spring)}
.settings-panel .toggle-row .switch input:checked+.slider{background:linear-gradient(145deg,var(--p),var(--pd));box-shadow:var(--nLi),0 0 10px var(--pglow)}
.settings-panel .toggle-row .switch input:checked+.slider::before{transform:translateX(20px);background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.settings-panel .menu-list{background:var(--bg2);border-radius:var(--rs);overflow:hidden;box-shadow:-3px -3px 7px var(--nL),3px 3px 7px var(--nD)}
.settings-panel .menu-item-row{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--gBrd)}
.settings-panel .menu-item-row:last-child{border-bottom:none}
.settings-panel .menu-item-row:active{box-shadow:var(--nLi),var(--nLi2)}
.settings-panel .menu-item-row .mi-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.settings-panel .menu-item-row .mi-icon svg{width:18px;height:18px;stroke:var(--t2);fill:none;stroke-width:2}
.settings-panel .menu-item-row.danger .mi-icon svg{stroke:var(--err)}
.settings-panel .menu-item-row .mi-label{flex:1;font-size:14px;font-weight:500;color:var(--t1)}
.settings-panel .menu-item-row.danger .mi-label{color:var(--err)}
.settings-panel .menu-item-row .mi-arrow{color:var(--t3);font-size:18px;font-weight:300}
.settings-panel .logout-btn{display:block;width:100%;padding:12px;border-radius:var(--rs);background:var(--bg2);color:var(--err);font-size:14px;font-weight:600;box-shadow:-3px -3px 7px var(--nL),3px 3px 7px var(--nD);transition:box-shadow var(--t),transform .12s var(--sp),color .2s;margin-top:8px}
.settings-panel .logout-btn:hover{box-shadow:-4px -4px 9px var(--nL),4px 4px 9px var(--nD),inset 0 0 0 1px rgba(199,91,91,.15)}
.settings-panel .logout-btn:active{transform:scale(.96);box-shadow:var(--nLi),var(--nLi2)}
.settings-panel .about-box{text-align:center;padding:24px 14px}
.settings-panel .about-box .ab-logo{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;background:var(--bg2);box-shadow:-4px -4px 10px var(--nL),4px 4px 10px var(--nD)}
.settings-panel .about-box .ab-logo svg{width:60%;height:60%}
.settings-panel .about-box .ab-name{font-family:var(--fd);font-size:17px;font-weight:700;letter-spacing:-.3px}
.settings-panel .about-box .ab-ver{font-family:var(--fm);font-size:11px;color:var(--t3);margin-top:4px;opacity:.7}
.settings-panel .about-box .ab-desc{font-size:12px;color:var(--t2);margin-top:10px;line-height:1.6}

/* ═══════════════════════════════════════════════════════════════
   Theme Customizer — color swatches + background presets
   ═══════════════════════════════════════════════════════════════ */
.theme-group{margin-bottom:16px}
.theme-group:last-child{margin-bottom:0}
.theme-subtitle{font-family:var(--fm);font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;opacity:.7;margin-bottom:10px}
.swatch-grid{display:flex;flex-wrap:wrap;gap:10px}
.swatch{position:relative;width:38px;height:38px;border-radius:50%;cursor:pointer;transition:transform .2s var(--sp),box-shadow .25s var(--eo);background:var(--bg2);box-shadow:-3px -3px 7px var(--nL),3px 3px 7px var(--nD);display:flex;align-items:center;justify-content:center}
.swatch:hover{transform:translateY(-2px);box-shadow:-4px -4px 10px var(--nL),4px 4px 10px var(--nD)}
.swatch:active{transform:scale(.9);box-shadow:var(--nLi),var(--nLi2)}
.swatch .dot{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 1px 2px rgba(255,255,255,.15),inset 0 -1px 2px rgba(0,0,0,.25);transition:transform .2s var(--sp)}
.swatch.active{box-shadow:var(--nLi),var(--nLi2),0 0 0 2px var(--pglow)}
.swatch.active .dot{transform:scale(1.1)}
.swatch.active::after{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;top:-2px;right:-2px;box-shadow:0 1px 3px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.swatch-label{font-size:10px;color:var(--t3);text-align:center;margin-top:5px;font-family:var(--fm);opacity:.6;position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);white-space:nowrap}
.swatch-wrap{position:relative;margin-bottom:22px}
.swatch-wrap:last-child{margin-bottom:0}

/* Custom color picker (neumorphic, replaces native input[type=color]) */
.custom-color-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--rs);background:var(--bg2);box-shadow:-3px -3px 7px var(--nL),3px 3px 7px var(--nD);margin-top:12px;position:relative}
.custom-color-row label{font-size:13px;color:var(--t2);flex:1}
.cp-trigger{width:36px;height:36px;border-radius:50%;cursor:pointer;background:var(--bg2);box-shadow:-2px -2px 5px var(--nL),2px 2px 5px var(--nD);display:flex;align-items:center;justify-content:center;transition:transform .2s var(--sp),box-shadow .25s var(--eo);flex:none;position:relative}
.cp-trigger:hover{transform:translateY(-2px);box-shadow:-3px -3px 8px var(--nL),3px 3px 8px var(--nD)}
.cp-trigger:active{transform:scale(.94);box-shadow:var(--nLi),var(--nDi)}
.cp-trigger .cp-dot{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 1px 2px rgba(255,255,255,.2),inset 0 -1px 2px rgba(0,0,0,.3)}
.cp-panel{position:absolute;top:calc(100% + 8px);right:0;z-index:150;width:220px;padding:14px;border-radius:var(--rm);background:var(--dd-glass);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--gBrd);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 50px -16px rgba(0,0,0,.7);opacity:0;transform:translateY(-6px) scale(.96);pointer-events:none;transition:opacity .22s var(--eo),transform .22s var(--sp)}
.cp-panel.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.cp-preview{width:100%;height:32px;border-radius:8px;margin-bottom:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 3px rgba(0,0,0,.3)}
.cp-hue-slider{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:5px;background:linear-gradient(to right,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000);outline:none;cursor:pointer;margin-bottom:12px}
.cp-hue-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.2);box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer}
.cp-hue-slider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,.2);box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer}
.cp-hex-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cp-hex-row .cp-hex-label{font-size:11px;color:var(--t3);font-family:var(--fm);flex:none}
.cp-hex-input{flex:1;padding:7px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--gBrd);color:var(--t1);font-size:13px;font-family:var(--fm);outline:none;text-transform:uppercase}
.cp-hex-input:focus{border-color:var(--pglow)}
.cp-quick{display:flex;gap:6px;flex-wrap:wrap}
.cp-quick .cp-quick-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);transition:transform .15s var(--sp)}
.cp-quick .cp-quick-dot:hover{transform:scale(1.15)}

/* Background swatch (rectangular) */
.bg-swatch{position:relative;width:100%;height:44px;border-radius:10px;cursor:pointer;transition:transform .2s var(--sp),box-shadow .25s var(--eo);box-shadow:-3px -3px 7px var(--nL),3px 3px 7px var(--nD);display:flex;align-items:center;padding:0 14px;gap:8px}
.bg-swatch:hover{transform:translateY(-1px);box-shadow:-4px -4px 9px var(--nL),4px 4px 9px var(--nD)}
.bg-swatch:active{transform:scale(.98);box-shadow:var(--nLi),var(--nLi2)}
.bg-swatch.active{box-shadow:var(--nLi),var(--nLi2),inset 0 0 0 1.5px var(--pglow)}
.bg-swatch .bg-preview{width:18px;height:18px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.bg-swatch .bg-name{font-size:13px;color:var(--t1);font-weight:500}
.bg-swatch.active .bg-name{color:var(--p)}

/* Theme reset button */
.theme-reset{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border-radius:var(--rs);background:var(--bg2);color:var(--t3);font-size:13px;font-weight:500;box-shadow:-2px -2px 5px var(--nL),2px 2px 5px var(--nD);transition:box-shadow .25s var(--eo),color .2s,transform .15s var(--sp);margin-top:4px}
.theme-reset:hover{color:var(--t1);box-shadow:-3px -3px 8px var(--nL),3px 3px 8px var(--nD)}
.theme-reset:active{transform:scale(.97);box-shadow:var(--nLi),var(--nLi2)}
.theme-reset svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* Project import UI */
.import-row{display:flex;gap:8px;margin-top:8px}
.import-input{flex:1;padding:10px 12px;border-radius:var(--rs);background:var(--bg);border:1px solid var(--gBrd);color:var(--t1);font-size:13px;font-family:var(--fm);outline:none;transition:border-color .2s}
.import-input:focus{border-color:var(--pglow)}
.import-input::placeholder{color:var(--t3)}
.import-btn{flex:none;padding:0 16px;border-radius:var(--rs);background:var(--p);border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s,transform .15s var(--sp);display:flex;align-items:center;gap:5px}
.import-btn:hover{background:var(--pd)}
.import-btn:active{transform:scale(.96)}
.import-btn:disabled{background:var(--btn-bg);color:var(--t3);cursor:not-allowed}
.import-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.import-btn .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
.imported-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.imported-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--rs);background:var(--bg2);box-shadow:-2px -2px 5px var(--nL),2px 2px 5px var(--nD);transition:box-shadow .2s}
.imported-item:hover{box-shadow:-3px -3px 7px var(--nL),3px 3px 7px var(--nD)}
.imported-item .ii-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--bg);box-shadow:-1px -1px 3px var(--nL),1px 1px 3px var(--nD)}
.imported-item .ii-icon svg{width:14px;height:14px;stroke:var(--p);fill:none;stroke-width:2}
.imported-item .ii-text{flex:1;min-width:0}
.imported-item .ii-name{font-size:13px;color:var(--t1);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imported-item .ii-path{font-size:11px;color:var(--t3);font-family:var(--fm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.imported-item .ii-delete{flex:none;width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--bg);box-shadow:-1px -1px 3px var(--nL),1px 1px 3px var(--nD);transition:box-shadow .2s,transform .15s}
.imported-item .ii-delete:hover{box-shadow:var(--nLi),var(--nDi)}
.imported-item .ii-delete:active{transform:scale(.92)}
.imported-item .ii-delete svg{width:13px;height:13px;stroke:var(--err);fill:none;stroke-width:2}

/* Settings trigger card */
.dd-trigger-card{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;border-radius:var(--rs);background:var(--bg2);box-shadow:-3px -3px 7px var(--nL),3px 3px 7px var(--nD);transition:box-shadow .3s var(--eo),transform .15s var(--sp)}
.dd-trigger-card:hover{box-shadow:-4px -4px 9px var(--nL),4px 4px 9px var(--nD);transform:translateY(-1px)}
.dd-trigger-card:active{transform:scale(.98);box-shadow:var(--nLi),var(--nLi2)}
.dd-trigger-card.open{box-shadow:var(--nLi),var(--nLi2),inset 0 0 0 1px var(--pglow)}
.dd-trigger-card .dd-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--bg);box-shadow:-1px -1px 3px var(--nL),1px 1px 3px var(--nD)}
.dd-trigger-card .dd-icon svg{width:15px;height:15px;stroke:var(--p);fill:none;stroke-width:2}
.dd-trigger-card .dd-text{flex:1;min-width:0}
.dd-trigger-card .dd-label{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;font-family:var(--fm);font-weight:600;opacity:.7}
.dd-trigger-card .dd-value{font-size:14px;color:var(--t1);font-family:var(--fb);font-weight:500;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-trigger-card .dd-chev{color:var(--t3);flex:none;transition:transform .3s var(--eo)}
.dd-trigger-card.open .dd-chev{transform:rotate(180deg)}
.dd-trigger-card .dd-chev svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* ═══════════════════════════════════════════════════════════════
   Question Modal
   ═══════════════════════════════════════════════════════════════ */
.modal-overlay{position:fixed;inset:0;z-index:9997;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .3s var(--eo),visibility .3s}
.modal-overlay.open{opacity:1;visibility:visible}
.modal-card{width:100%;max-width:380px;background:var(--bg2);border-radius:var(--rl);padding:24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.94) translateY(10px);transition:transform .35s var(--sp);border:1px solid var(--gBrd)}
.modal-overlay.open .modal-card{transform:scale(1) translateY(0)}
.modal-card .modal-icon{width:40px;height:40px;border-radius:12px;background:var(--pdim);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.modal-card .modal-icon svg{width:20px;height:20px;stroke:var(--p);fill:none;stroke-width:2}
.modal-card .modal-question{font-size:15px;font-weight:600;color:var(--t1);line-height:1.5;margin-bottom:16px}
.modal-options{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.modal-option{padding:12px 14px;border-radius:var(--rs);background:var(--bg);color:var(--t1);font-size:14px;text-align:left;transition:background .15s,box-shadow .15s;border:1px solid var(--gBrd)}
.modal-option:hover{background:var(--s5)}
.modal-option.selected{background:var(--pdim);border-color:rgba(217,119,87,.3);color:var(--p)}
.modal-input{width:100%;padding:12px 14px;border-radius:var(--rs);background:var(--bg);border:1px solid var(--gBrd);color:var(--t1);font-size:14px;outline:none;box-shadow:var(--nLi),var(--nLi2);margin-bottom:16px}
.modal-input:focus{border-color:var(--pglow)}
.modal-actions{display:flex;gap:8px}
.modal-actions button{flex:1;padding:12px;border-radius:var(--rs);font-size:14px;font-weight:600;transition:transform .12s var(--sp),box-shadow var(--t)}
.modal-actions .cancel{background:var(--bg);color:var(--t2);box-shadow:-2px -2px 5px var(--nL),2px 2px 5px var(--nD)}
.modal-actions .cancel:active{transform:scale(.96);box-shadow:var(--nLi),var(--nLi2)}
.modal-actions .send{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;box-shadow:-2px -2px 5px var(--nL),2px 2px 5px var(--nD),0 4px 14px var(--pglow)}
.modal-actions .send:active{transform:scale(.96);box-shadow:var(--nLi),var(--nLi2)}
.modal-actions .send:disabled{opacity:.5;cursor:not-allowed}

/* ═══════════════════════════════════════════════════════════════
   Toast
   ═══════════════════════════════════════════════════════════════ */
.toast-container{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:9996;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:100%;max-width:400px;padding:0 16px}

  if (state.currentStreamMsgId) finalizeAssistantMessage(state.currentStreamMsgId);
