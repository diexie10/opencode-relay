  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">设置</span>
        <button class="sidebar-close" id="settings-close-btn" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body" id="settings-body">
        <div id="settings-main">
          <div class="settings-status">
            <span>密码状态：</span>
            <span class="settings-status-badge">已设置</span>
          </div>
          <button class="settings-change-btn" id="settings-change-btn">修改密码</button>
          <div class="settings-note">修改密码后需要重启 Relay 才能生效</div>
        </div>
        <div class="settings-form" id="settings-form" style="display:none">
          <div class="setup-field">
            <label class="setup-label">新密码</label>
            <div class="password-wrap">
              <input class="setup-input" id="settings-password" type="password" placeholder="输入密码（至少4位）" autocomplete="new-password">
              <button class="pw-toggle" id="settings-pw-toggle" type="button" aria-label="显示密码">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="setup-field">
            <label class="setup-label">确认密码</label>
            <div class="password-wrap">
              <input class="setup-input" id="settings-confirm" type="password" placeholder="再次输入密码" autocomplete="new-password">
              <button class="pw-toggle" id="settings-confirm-toggle" type="button" aria-label="显示密码">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="setup-error" id="settings-error"></div>
          <button class="setup-btn" id="settings-save-btn">
            <span id="settings-btn-text">保存</span>
            <div class="spinner" id="settings-spinner" style="display:none"></div>
          </button>
          <div class="setup-success" id="settings-success">
            <div class="setup-success-msg">密码已保存！请重启 Relay</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function() {
    'use strict';

    // ═══════════════════════════════════════════════════════════════
    // ─── Constants
    // ═══════════════════════════════════════════════════════════════
    const DIRECTORY = 'C:\\Users\\xxx\\Desktop';
    const STORAGE_KEY = 'ocr_v2_data';
    const SSE_TIMEOUT_MS = 60000;
    const RECONNECT_MAX_DELAY = 16000;
    const QUESTION_POLL_INTERVAL = 3000;

    // ═══════════════════════════════════════════════════════════════
    // ─── State
    // ═══════════════════════════════════════════════════════════════
    let state = {
      token: null,
      currentSessionId: null,
      sessions: [],       // {id, slug, title, messages[], createdAt, lastActiveAt}
      status: 'connecting',
      isSending: false,
      currentQuestion: null,   // {requestID, question, type, options}
      currentStreamMsgId: null, // ID of assistant message being streamed
      lastEventTime: 0,
    };

    // ═══════════════════════════════════════════════════════════════
    // ─── DOM References
    // ═══════════════════════════════════════════════════════════════
    const $ = (s, p) => (p || document).querySelector(s);
    const dom = {};

    function cacheDom() {
      dom.overlay = $('#overlay');
      dom.overlaySpinner = $('#overlay-spinner');
      dom.overlayMsg = $('#overlay-msg');
      dom.retryBtn = $('#retry-btn');
      dom.chatMessages = $('#chat-messages');
      dom.chatContainer = $('#chat-container');
      dom.msgInput = $('#msg-input');
      dom.sendBtn = $('#send-btn');
      dom.menuBtn = $('#menu-btn');
      dom.statusDot = $('#status-dot');
      dom.statusLabel = $('#status-label');
      dom.sessionIndicator = $('#session-indicator');
      dom.sidebar = $('#sidebar');
      dom.sidebarOverlay = $('#sidebar-overlay');
      dom.sidebarBody = $('#sidebar-body');
      dom.sidebarClose = $('#sidebar-close');
      dom.newSessionBtn = $('#new-session-btn');
      dom.modalOverlay = $('#modal-overlay');
      dom.modalQuestion = $('#modal-question');
      dom.modalOptions = $('#modal-options');
      dom.modalInput = $('#modal-input');
      dom.modalCancel = $('#modal-cancel');
      dom.modalSend = $('#modal-send');
      dom.toastContainer = $('#toast-container');
      dom.app = $('#app');
      dom.setupPage = $('#setup-page');
      dom.setupPassword = $('#setup-password');
      dom.setupConfirm = $('#setup-confirm');
      dom.setupPwToggle = $('#setup-pw-toggle');
      dom.setupConfirmToggle = $('#setup-confirm-toggle');
      dom.setupError = $('#setup-error');
      dom.setupFields = $('#setup-fields');
      dom.setupSuccess = $('#setup-success');
      dom.setupSaveBtn = $('#setup-save-btn');
      dom.setupSpinner = $('#setup-spinner');
      dom.setupBtnText = $('#setup-btn-text');
      dom.setupRestartBtn = $('#setup-restart-btn');
      dom.settingsBtn = $('#settings-btn');
      dom.settingsOverlay = $('#settings-overlay');
      dom.settingsCloseBtn = $('#settings-close-btn');
      dom.settingsMain = $('#settings-main');
      dom.settingsForm = $('#settings-form');
      dom.settingsPassword = $('#settings-password');
      dom.settingsConfirm = $('#settings-confirm');
      dom.settingsPwToggle = $('#settings-pw-toggle');
      dom.settingsConfirmToggle = $('#settings-confirm-toggle');
      dom.settingsError = $('#settings-error');
      dom.settingsSaveBtn = $('#settings-save-btn');
      dom.settingsSpinner = $('#settings-spinner');
      dom.settingsBtnText = $('#settings-btn-text');
      dom.settingsSuccess = $('#settings-success');
      dom.settingsChangeBtn = $('#settings-change-btn');
      dom.loginPage = $('#login-page');
      dom.loginPassword = $('#login-password');
      dom.loginPwToggle = $('#login-pw-toggle');
      dom.loginError = $('#login-error');
      dom.loginBtn = $('#login-btn');
      dom.loginBtnText = $('#login-btn-text');
      dom.loginSpinner = $('#login-spinner');
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Token
    // ═══════════════════════════════════════════════════════════════
    function getToken() {
      return state.token;
    }

    function initToken() {
      const params = new URLSearchParams(location.search);
      const t = params.get('token');
      if (t) {
        state.token = t;
        sessionStorage.setItem('ocr_token', t);
        // Remove token from URL without reload
        const cleanUrl = location.pathname + location.hash;
        history.replaceState(null, '', cleanUrl);
        return true;
      }
      // Fallback: check sessionStorage
      state.token = sessionStorage.getItem('ocr_token');
      return !!state.token;
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Login Page
    // ═══════════════════════════════════════════════════════════════

    function showLoginPage() {
      dom.loginPage.style.display = '';
      dom.app.style.display = 'none';
      hideOverlay();
      setTimeout(() => dom.loginPassword.focus(), 100);
    }

    function hideLoginPage() {
      dom.loginPage.style.display = 'none';
    }

    async function handleLogin() {
      const pwd = dom.loginPassword.value.trim();
      if (!pwd) {
        dom.loginError.textContent = '请输入密码';
        dom.loginError.style.display = '';
        return;
      }

      dom.loginError.style.display = 'none';
      dom.loginBtn.disabled = true;
      dom.loginBtnText.style.display = 'none';
      dom.loginSpinner.style.display = '';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd }),
        });
        const data = await res.json();

        if (data.ok && data.token) {
          sessionStorage.setItem('ocr_token', data.token);
          location.reload();
        } else {
          dom.loginError.textContent = data.error || '密码错误';
          dom.loginError.style.display = '';
          dom.loginBtn.disabled = false;
          dom.loginBtnText.style.display = '';
          dom.loginSpinner.style.display = 'none';
          dom.loginPassword.focus();
          dom.loginPassword.select();
        }
      } catch (err) {
        dom.loginError.textContent = '网络错误，无法连接服务器';
        dom.loginError.style.display = '';
        dom.loginBtn.disabled = false;
        dom.loginBtnText.style.display = '';
        dom.loginSpinner.style.display = 'none';
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── API Helper
    // ═══════════════════════════════════════════════════════════════
    async function apiFetch(path, options = {}) {
      const separator = path.includes('?') ? '&' : '?';
      const url = path + separator + 'directory=' + encodeURIComponent(DIRECTORY);
      const headers = {
        'X-Auth-Token': getToken(),
        ...(options.headers || {}),
      };
      if (options.body && !options.bodyFormatted) {
        headers['Content-Type'] = 'application/json';
      }
      const res = await fetch(url, {
        method: options.method || 'GET',
        headers: headers,
        body: options.body || undefined,
        signal: options.signal || undefined,
      });
      if (!res.ok) {
        // 401 → token expired or invalid, redirect to login
        if (res.status === 401) {
          sessionStorage.removeItem('ocr_token');
          location.reload();
          // never reaches here
        }
        let errMsg = '';
        try { errMsg = await res.text(); } catch (e) { errMsg = res.statusText; }
        const err = new Error(errMsg || `HTTP ${res.status}`);
        err.status = res.status;
        throw err;
      }
      return res;
    }

    function apiJson(path, options = {}) {
      return apiFetch(path, options).then(r => r.json());
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Storage
    // ═══════════════════════════════════════════════════════════════
    function saveStorage() {
      try {
        const data = {
          sessions: state.sessions.map(s => ({
            id: s.id,
            slug: s.slug,
            title: s.title,
            messages: s.messages,
            createdAt: s.createdAt,
            lastActiveAt: s.lastActiveAt,
          })),
          currentSessionId: state.currentSessionId,
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        // localStorage full or disabled
      }
    }

    function loadStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    function saveSessionMessages(sessionId) {
      const session = state.sessions.find(s => s.id === sessionId);
      if (!session) return;
      try {
        const key = 'ocr_msgs_' + sessionId;
        localStorage.setItem(key, JSON.stringify(session.messages));
      } catch (e) {}
    }

    function loadSessionMessages(sessionId) {
      try {
        const key = 'ocr_msgs_' + sessionId;
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    // ─── Backend sync helpers ────────────────────────────────────────────────

    // Fetch session list from opencode serve backend
    async function fetchSessions() {
      try {
        const data = await apiJson('/api/session');
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    // Fetch messages for a session from backend
    async function fetchMessages(sessionId) {
      try {
        const data = await apiJson('/api/session/' + encodeURIComponent(sessionId) + '/message');
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    // Convert server message format → frontend format
    // Server: {info:{id,role,time}, parts:[{type,text},...]}
    // Frontend: {id, role, content, isStreaming}
    function convertServerMsg(serverMsg) {
      const text = (serverMsg.parts || [])
        .filter(p => p.type === 'text')
        .map(p => p.text)
        .join('\n');
      return {
        id: serverMsg.info.id,
        role: serverMsg.info.role,
        content: text,
        isStreaming: false,
      };
    }

    // Merge server messages into a session's local messages (deduplicate by id)
    function mergeBackendMessages(session, serverMsgs) {
      const localIds = new Set(session.messages.map(m => m.id));
      const newOnes = serverMsgs
        .map(convertServerMsg)
        .filter(m => !localIds.has(m.id) && m.content);
      if (newOnes.length > 0) {
        // Prepend older messages, then local messages (newest last) — server returns chrono order
        session.messages = [...newOnes, ...session.messages];
      }
    }

    // Merge backend sessions into state.sessions (deduplicate by id)
    function mergeBackendSessions(backendSessions) {
      const localIds = new Set(state.sessions.map(s => s.id));
      for (const s of backendSessions) {
        if (!localIds.has(s.id)) {
          state.sessions.push({
            id: s.id,
            slug: s.slug || '',
            title: s.title || '会话',
            messages: [],
            createdAt: s.time?.created || Date.now(),
            lastActiveAt: s.time?.updated || Date.now(),
          });
        }
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Status
    // ═══════════════════════════════════════════════════════════════
    function setStatus(status, label) {
      state.status = status;
      dom.statusDot.className = 'status-dot';
      if (status === 'connected') {
        dom.statusDot.classList.add('connected');
        dom.statusLabel.textContent = label || '已连接';
        hideOverlay();
      } else if (status === 'reconnecting') {
        dom.statusDot.classList.add('reconnecting');
        dom.statusLabel.textContent = label || '重连中';
      } else if (status === 'error') {
        dom.statusDot.classList.add('error');
        dom.statusLabel.textContent = label || '不可用';
      } else {
        dom.statusLabel.textContent = label || '连接中';
      }

      // Update input enabled state
      const canChat = (status === 'connected');
      dom.msgInput.disabled = !canChat;
      if (!canChat) dom.sendBtn.disabled = true;
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Overlay
    // ═══════════════════════════════════════════════════════════════
    function showOverlay(msg, isError) {
      dom.overlayMsg.innerHTML = msg;
      dom.overlayMsg.className = 'overlay-msg' + (isError ? ' error' : '');
      dom.overlay.classList.remove('hidden');
      dom.overlaySpinner.style.display = isError ? 'none' : '';
      dom.retryBtn.style.display = isError ? '' : 'none';
    }

    function hideOverlay() {
      dom.overlay.classList.add('hidden');
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Toast
    // ═══════════════════════════════════════════════════════════════
    function showToast(msg, type) {
      type = type || 'info';
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.textContent = msg;
      dom.toastContainer.appendChild(el);
      setTimeout(() => {
        el.classList.add('removing');
        setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 200);
      }, 3000);
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Session Management
    // ═══════════════════════════════════════════════════════════════
    async function createSession() {
      const data = await apiJson('/api/session', { method: 'POST' });
      return {
        id: data.id,
        slug: data.slug || '',
        title: data.title || 'New session',
        messages: [],
        createdAt: Date.now(),
        lastActiveAt: Date.now(),
      };
    }

    function getSession(id) {
      return state.sessions.find(s => s.id === id);
    }

    function getCurrentSession() {
      if (!state.currentSessionId) return null;
      return getSession(state.currentSessionId);
    }

    async function ensureSession() {
      // 1. Restore from localStorage cache
      const stored = loadStorage();
      if (stored && stored.sessions && stored.sessions.length > 0) {
        state.sessions = stored.sessions;
        state.currentSessionId = stored.currentSessionId || stored.sessions[0].id;
      }

      // 2. Fetch backend sessions and merge (brings in Desktop history)
      const backendSessions = await fetchSessions();
      if (backendSessions.length > 0) {
        mergeBackendSessions(backendSessions);
        // Pick current session from backend if none from localStorage
        if (!state.currentSessionId) {
          state.currentSessionId = state.sessions[0]?.id;
        }
      }

      // 3. Load local-cached messages, then fetch backend messages
      const cur = getCurrentSession();
      if (cur) {
        const saved = loadSessionMessages(cur.id);
        if (saved.length > 0) {
          cur.messages = saved;
        }
        const serverMsgs = await fetchMessages(cur.id);
        if (serverMsgs.length > 0) {
          mergeBackendMessages(cur, serverMsgs);
          saveSessionMessages(cur.id); // update local cache
        }
      }

      // 4. Render if we have any sessions
      if (state.sessions.length > 0) {
        renderMessages();
        renderSidebar();
        return;
      }

      // 5. No sessions at all — create one
      let session;
      try {
        session = await createSession();
      } catch (err) {
        showOverlay('无法创建会话: ' + err.message, true);
        setStatus('error', '不可用');
        throw err;
      }

      state.sessions.push(session);
      state.currentSessionId = session.id;
      saveStorage();
      renderSidebar();
      setStatus('connecting', '连接中');
    }

    async function switchSession(id) {
      if (id === state.currentSessionId) return;

      // Save current session messages
      if (state.currentSessionId) {
        saveSessionMessages(state.currentSessionId);
      }

      // Switch
      state.currentSessionId = id;
      saveStorage();

      // Fetch backend messages for this session
      const session = getSession(id);
      if (session) {
        // Load local cache first for immediate display
        const saved = loadSessionMessages(id);
        if (saved.length > 0) {
          session.messages = saved;
        }
        // Then fetch from backend and merge
        const serverMsgs = await fetchMessages(id);
        if (serverMsgs.length > 0) {
          mergeBackendMessages(session, serverMsgs);
          saveSessionMessages(id);
        }
      }

      renderMessages();
      renderSidebar();
      dom.sessionIndicator.textContent = session ? session.title.slice(0, 30) : '';
    }

    async function handleNewSession() {
      let session;
      try {
        session = await createSession();
      } catch (err) {
        showToast('创建会话失败: ' + err.message, 'error');
        return;
      }

      // Save current session
      if (state.currentSessionId) {
        saveSessionMessages(state.currentSessionId);
      }

      // Add new session
      state.sessions.push(session);
      state.currentSessionId = session.id;
      saveStorage();
      renderSidebar();
      renderMessages();
      dom.sessionIndicator.textContent = '';
      closeSidebar();
      showToast('新会话已创建', 'success');
    }

    function deleteSession(id, e) {
      if (e) { e.stopPropagation(); }
      if (state.sessions.length <= 1) {
        showToast('至少保留一个会话', 'error');
        return;
      }
      const idx = state.sessions.findIndex(s => s.id === id);
      if (idx === -1) return;

      state.sessions.splice(idx, 1);
      if (state.currentSessionId === id) {
        state.currentSessionId = state.sessions[0] ? state.sessions[0].id : null;
        if (state.currentSessionId) {
          const saved = loadSessionMessages(state.currentSessionId);
          const cur = getSession(state.currentSessionId);
          if (cur && saved.length > 0) cur.messages = saved;
          renderMessages();
          renderSidebar();
        }
      }
      saveSessionMessages(id); // No-op for deleted session
      saveStorage();
      renderSidebar();
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Sidebar
    // ═══════════════════════════════════════════════════════════════
    function renderSidebar() {
      dom.sidebarBody.innerHTML = '';
      state.sessions.forEach(s => {
        const item = document.createElement('div');
        item.className = 'session-item' + (s.id === state.currentSessionId ? ' active' : '');
        item.setAttribute('data-id', s.id);

        const dateStr = s.lastActiveAt ? new Date(s.lastActiveAt).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) : '';

        item.innerHTML =
          '<div class="session-item-icon">💬</div>' +
          '<div class="session-item-info">' +
            '<div class="session-item-title">' + escapeHtml(s.title || s.id) + '</div>' +
            '<div class="session-item-meta">' + s.messages.length + ' 条消息' + (dateStr ? ' · ' + dateStr : '') + '</div>' +
          '</div>' +
          '<button class="session-item-delete" aria-label="删除">✕</button>';

        item.addEventListener('click', () => {
          switchSession(s.id);
          closeSidebar();
        });

        const delBtn = item.querySelector('.session-item-delete');
        delBtn.addEventListener('click', (e) => deleteSession(s.id, e));

        dom.sidebarBody.appendChild(item);
      });
    }

    function openSidebar() {
      dom.sidebar.classList.add('open');
      dom.sidebarOverlay.classList.add('open');
    }

    function closeSidebar() {
      dom.sidebar.classList.remove('open');
      dom.sidebarOverlay.classList.remove('open');
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Message Rendering
    // ═══════════════════════════════════════════════════════════════
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderMarkdown(text) {
      if (!text) return '';
      try {
        // Use marked if available
        let html = text;
        if (typeof marked !== 'undefined' && marked.parse) {
          html = marked.parse(text, { breaks: true, gfm: true });
        }
        // Sanitize with DOMPurify if available
        if (typeof DOMPurify !== 'undefined' && DOMPurify.sanitize) {
          html = DOMPurify.sanitize(html, {
            ADD_ATTR: ['target'],
            ALLOWED_TAGS: [
              'p','br','b','i','strong','em','a','ul','ol','li',
              'h1','h2','h3','h4','h5','h6','code','pre','blockquote',
              'hr','table','thead','tbody','tr','th','td','img',
              'span','div','del','ins','sup','sub','dl','dt','dd'
            ],
          });
        }
        return html;
      } catch (e) {
        return escapeHtml(text);
      }
    }

    function renderMessages() {
      const session = getCurrentSession();
      dom.chatMessages.innerHTML = '';
      dom.chatContainer.scrollTop = 0;

      if (!session || session.messages.length === 0) {
        dom.chatMessages.innerHTML = '';
        return;
      }

      session.messages.forEach(msg => {
        appendMessageToDOM(msg, false);
      });

      scrollToBottom();
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        dom.chatContainer.scrollTop = dom.chatContainer.scrollHeight;
      });
    }

    function appendMessageToDOM(msg, animate = true) {
      const el = document.createElement('div');
      el.className = 'msg ' + msg.role;
      el.id = 'msg-' + msg.id;
      if (animate) el.style.animation = 'none';

      if (msg.role === 'tool') {
        // Collapsible tool call
        let displayName = msg.toolName || 'tool';
        let displayArgs = '';
        if (msg.toolArgs) {
          try {
            displayArgs = typeof msg.toolArgs === 'string' ? msg.toolArgs : JSON.stringify(msg.toolArgs, null, 2);
          } catch (e) { displayArgs = String(msg.toolArgs); }
        }

        el.innerHTML =
          '<div class="msg-bubble">' +
            '<div class="tool-header">' +
              '<span class="tool-icon">🔧</span>' +
              '<span class="tool-name">' + escapeHtml(displayName) + '</span>' +
              '<span class="tool-arrow">▶</span>' +
            '</div>' +
            '<div class="tool-body">' + escapeHtml(displayArgs || msg.content || '') + '</div>' +
          '</div>';

        el.querySelector('.tool-header').addEventListener('click', function() {
          const body = this.nextElementSibling;
          const arrow = this.querySelector('.tool-arrow');
          body.classList.toggle('open');
          arrow.classList.toggle('open');
        });

        // Auto-open if result content is short
        const body = el.querySelector('.tool-body');
        if (msg.content && msg.content.length < 200) {
          body.classList.add('open');
          el.querySelector('.tool-arrow').classList.add('open');
        }
      } else if (msg.role === 'user') {
        el.innerHTML =
          '<div class="msg-bubble">' + escapeHtml(msg.content) + '</div>';
      } else {
        // Assistant
        const isStreaming = msg.isStreaming || false;
        const rendered = renderMarkdown(msg.content);
        el.innerHTML =
          '<div class="msg-bubble' + (isStreaming ? ' streaming-cursor' : '') + '">' + rendered + '</div>';
      }

      dom.chatMessages.appendChild(el);

      if (!animate) {
        // Force animation reset
        el.style.animation = 'fadeIn 0.2s ease-out';
      }
    }

    function updateAssistantMessage(msgId, content, isStreaming) {
      const el = document.getElementById('msg-' + msgId);
      if (!el) return;

      const bubble = el.querySelector('.msg-bubble');
      if (!bubble) return;

      const rendered = renderMarkdown(content);
      bubble.innerHTML = rendered;

      if (isStreaming) {
        bubble.classList.add('streaming-cursor');
      } else {
        bubble.classList.remove('streaming-cursor');
      }

      scrollToBottom();
    }

    function addToolMessage(msg) {
      const session = getCurrentSession();
      if (!session) return;

      session.messages.push(msg);
      saveSessionMessages(state.currentSessionId);
      saveStorage();
      appendMessageToDOM(msg);
      scrollToBottom();
    }

    function addUserMessage(text) {
      const session = getCurrentSession();
      if (!session) return;

      const msg = {
        id: generateId(),
        role: 'user',
        content: text,
        isStreaming: false,
        timestamp: Date.now(),
      };
      session.messages.push(msg);
      session.lastActiveAt = Date.now();
      saveSessionMessages(state.currentSessionId);
      saveStorage();
      appendMessageToDOM(msg);
      scrollToBottom();
    }

    function addAssistantPlaceholder() {
      const session = getCurrentSession();
      if (!session) return;

      const msgId = generateId();
      const msg = {
        id: msgId,
        role: 'assistant',
        content: '',
        isStreaming: true,
        timestamp: Date.now(),
        _contentHash: '',
      };
      session.messages.push(msg);
      state.currentStreamMsgId = msgId;
      saveSessionMessages(state.currentSessionId);
      saveStorage();

      // Append placeholder with cursor
      const el = document.createElement('div');
      el.className = 'msg assistant';
      el.id = 'msg-' + msgId;
      el.innerHTML = '<div class="msg-bubble streaming-cursor"></div>';
      dom.chatMessages.appendChild(el);
      scrollToBottom();
      return msgId;
    }

    function finalizeAssistantMessage(msgId) {
      const session = getCurrentSession();
      if (!session) return;
      const msg = session.messages.find(m => m.id === msgId);
      if (msg) {
        msg.isStreaming = false;
        msg._contentHash = simpleHash(msg.content);
        saveSessionMessages(state.currentSessionId);
        saveStorage();
      }
      if (state.currentStreamMsgId === msgId) {
        state.currentStreamMsgId = null;
      }
      const el = document.getElementById('msg-' + msgId);
      if (el) {
        const bubble = el.querySelector('.msg-bubble');
        if (bubble) bubble.classList.remove('streaming-cursor');
      }
    }

    function generateId() {
      return 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    }

    function simpleHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + c;
        hash = hash & hash;
      }
      return 'h' + Math.abs(hash).toString(36);
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── SSE Stream Parser (reads SSE from a ReadableStream)
    // ═══════════════════════════════════════════════════════════════
    // SSE events come as the response body of POST /session/{id}/message
    // (not from a separate SSE endpoint). This parser reads them and
    // calls the appropriate handler for each event type.
    // ═══════════════════════════════════════════════════════════════

    async function readSSEFromResponse(response, handlers) {
      if (!response.ok || !response.body) return;

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let eventType = '';
      let eventData = '';

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          // Process complete lines from buffer
          while (buffer.includes('\n')) {
            const newlineIdx = buffer.indexOf('\n');
            const line = buffer.slice(0, newlineIdx);
            buffer = buffer.slice(newlineIdx + 1);

            if (line.startsWith(':')) continue; // comment/keepalive

            if (line.startsWith('event: ')) {
              eventType = line.slice(7).trim();
            } else if (line.startsWith('data: ')) {
              eventData += line.slice(6);
            } else if (line === '') {
              // Empty line = end of SSE event
              if (eventData && handlers) {
                handleSSEEvent(eventType, eventData, handlers);
              }
              eventType = '';
              eventData = '';
            }
          }
        }
        // Process any remaining data after stream ends
        if (eventData && handlers) {
          handleSSEEvent(eventType, eventData, handlers);
        }
      } catch (err) {
        // Stream read error (e.g. abort), ignore silently
      }
    }

    function handleSSEEvent(type, data, handlers) {
      let parsed;
      try {
        parsed = JSON.parse(data);
      } catch (e) {
        // Non-JSON data — treat as text delta if handler exists
        if (handlers.onDelta) handlers.onDelta(data);
        return;
      }

      // Map SSE event types to handlers
      if ((type === 'text_delta' || type === 'delta' || type === 'content') && handlers.onDelta) {
        handlers.onDelta(parsed.content || parsed.text || parsed.delta || '');

      } else if ((type === 'text') && handlers.onDelta) {
        handlers.onDelta(parsed.content || parsed.text || '');

      } else if ((type === 'message' || type === 'assistant_message') && handlers.onMessage) {
        handlers.onMessage(parsed.content || parsed.text || '', parsed);

      } else if ((type === 'tool_call' || type === 'tool_use') && handlers.onToolCall) {
        handlers.onToolCall(parsed);

      } else if (type === 'tool_result' && handlers.onToolResult) {
        handlers.onToolResult(parsed);

      } else if ((type === 'done' || type === 'message_done' || type === 'complete') && handlers.onDone) {
        handlers.onDone(parsed);

      } else if (type === 'error' && handlers.onError) {
        handlers.onError(parsed);

      } else if (type === 'question' && handlers.onQuestion) {
        handlers.onQuestion(parsed);

      } else {
        // Unknown event — try heuristic matching
        if (parsed.name && handlers.onToolCall) handlers.onToolCall(parsed);
        else if ((parsed.delta || parsed.content) && handlers.onDelta) handlers.onDelta(parsed.delta || parsed.content);
        else if (parsed.role === 'assistant' && handlers.onMessage) handlers.onMessage(parsed.content || '', parsed);
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Send Message
    // ═══════════════════════════════════════════════════════════════
    // The POST to /session/{id}/message returns SSE events directly
    // in the response body. We read the stream and parse events.
    async function sendMessage() {
      const text = dom.msgInput.value.trim();
      if (!text || state.isSending || !state.currentSessionId) return;

      const session = getCurrentSession();
      if (!session) return;

      state.isSending = true;
      updateSendBtn();

      // Add user message to UI
      addUserMessage(text);
      dom.msgInput.value = '';
      updateSendBtn();

      // Create assistant placeholder (streaming will fill it)
      addAssistantPlaceholder();
      setStatus('connecting', '等待回复...');

      const separator = DIRECTORY ? '?' : '';
      const url = '/api/session/' + encodeURIComponent(state.currentSessionId) +
                  '/message' + separator + 'directory=' + encodeURIComponent(DIRECTORY);

      try {
        const headers = { 'X-Auth-Token': getToken(), 'Content-Type': 'application/json' };
        const response = await fetch(url, {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({ parts: [{ type: 'text', text: text }] }),
        });

        if (!response.ok) {
          let errMsg = 'HTTP ' + response.status;
          try { const e = await response.json(); errMsg = e.error || e.message || errMsg; } catch {}

          // 404: session not found — likely stale localStorage from a previous relay instance.
          // Recreate the session and retry once.
          if (response.status === 404 && state.currentSessionId) {
            console.warn('[Send] Session not found, recreating...');
            try {
              const newSession = await createSession();
              state.sessions.push(newSession);
              state.currentSessionId = newSession.id;
              saveStorage(); renderSidebar();
              // Retry with new session (re-run sendMessage logic)
              state.isSending = false;
              updateSendBtn();
              dom.msgInput.value = text; // restore input
              return sendMessage(); // retry once
            } catch (recreateErr) {
              errMsg = '会话已过期，自动重建失败: ' + recreateErr.message;
            }
          }

          if (state.currentStreamMsgId) {
            const msg = getCurrentSession()?.messages.find(m => m.id === state.currentStreamMsgId);
            if (msg) { msg.content += '\n\n**错误**: ' + errMsg; msg.isStreaming = false; updateAssistantMessage(msg.id, msg.content, false); }
          }
          state.currentStreamMsgId = null;
          state.isSending = false; updateSendBtn(); setStatus('connected', '已连接');
          showToast('错误: ' + errMsg, 'error');
          return;
        }

        // Detect response format: SSE (text/event-stream) vs JSON (complete response)
        const contentType = response.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          // ── Complete JSON response (non-streaming) ──
          const data = await response.json();
          // Extract text from parts array
          let content = '';
          if (data.parts && Array.isArray(data.parts)) {
            content = data.parts
              .filter(p => p.type === 'text' || p.type === 'reasoning')
              .map(p => p.text || '')
              .join('\n');
          } else if (data.content) {
            content = data.content;
          } else if (data.text) {
            content = data.text;
          }
          // Update the assistant placeholder with the full response
          if (state.currentStreamMsgId && content) {
            const msg = getCurrentSession()?.messages.find(m => m.id === state.currentStreamMsgId);
            if (msg) {
              msg.content = content;
              msg.isStreaming = false;
              msg._contentHash = simpleHash(content);
              updateAssistantMessage(msg.id, content, false);
              saveSessionMessages(state.currentSessionId); saveStorage();
            }
            state.currentStreamMsgId = null;
          }
          // Handle tool calls in parts (if any)
          if (data.parts) {
            data.parts.forEach(p => {
              if ((p.type === 'tool_call' || p.type === 'tool_use') && p.name) {
                const tcMsg = { id: generateId(), role: 'tool', toolName: p.name, toolArgs: p.arguments || p.input || {}, content: '', isStreaming: false, timestamp: Date.now() };
                getCurrentSession()?.messages.push(tcMsg);
                appendMessageToDOM(tcMsg); scrollToBottom();
              }
            });
          }
          state.isSending = false; updateSendBtn(); setStatus('connected', '已连接');
          if (!content) showToast('收到空回复', 'info');
          saveSessionMessages(state.currentSessionId); saveStorage();
        } else {
          // ── SSE stream ──
          await readSSEFromResponse(response, {
            onDelta: (text) => {
              if (!state.currentStreamMsgId) addAssistantPlaceholder();
              const msg = getCurrentSession()?.messages.find(m => m.id === state.currentStreamMsgId);
              if (msg) {
                msg.content += text;
                msg.isStreaming = true;
                updateAssistantMessage(msg.id, msg.content, true);
                saveSessionMessages(state.currentSessionId);
              }
            },
            onMessage: (content, parsed) => {
              if (state.currentStreamMsgId) {
                const msg = getCurrentSession()?.messages.find(m => m.id === state.currentStreamMsgId);
                if (msg) {
                  if (content) msg.content = content;
                  msg.isStreaming = false;
                  msg._contentHash = simpleHash(msg.content);
                  updateAssistantMessage(msg.id, msg.content, false);
                  saveSessionMessages(state.currentSessionId);
                  saveStorage();
                }
                state.currentStreamMsgId = null;
              } else if (content) {
                const msg = {
                  id: generateId(), role: 'assistant', content,
                  isStreaming: false, timestamp: Date.now(),
                  _contentHash: simpleHash(content),
                };
                getCurrentSession()?.messages.push(msg);
                appendMessageToDOM(msg); scrollToBottom();
                saveSessionMessages(state.currentSessionId); saveStorage();
              }
            },
            onToolCall: (parsed) => {
              if (state.currentStreamMsgId) finalizeAssistantMessage(state.currentStreamMsgId);
              const name = parsed.name || parsed.tool || 'tool';
              const args = parsed.arguments || parsed.input || parsed.args || {};
              const msg = {
                id: generateId(), role: 'tool', toolName: name, toolArgs: args,
                content: parsed.content || '', isStreaming: false, timestamp: Date.now(),
              };
              getCurrentSession()?.messages.push(msg);
              appendMessageToDOM(msg); scrollToBottom();
              saveSessionMessages(state.currentSessionId); saveStorage();
            },
            onToolResult: (parsed) => {
              const session = getCurrentSession();
              if (!session) return;
              const resultContent = parsed.content || parsed.result || JSON.stringify(parsed);
              for (let i = session.messages.length - 1; i >= 0; i--) {
                const m = session.messages[i];
                if (m.role === 'tool') {
                  m.content = (m.content ? m.content + '\n' : '') + resultContent;
                  const el = document.getElementById('msg-' + m.id);
                  const body = el?.querySelector('.tool-body');
                  if (body) body.textContent = m.content;
                  break;
                }
              }
              saveSessionMessages(state.currentSessionId); saveStorage();
            },
            onDone: () => {
              if (state.currentStreamMsgId) finalizeAssistantMessage(state.currentStreamMsgId);
              state.isSending = false;
              updateSendBtn();
              setStatus('connected', '已连接');
            },
            onError: (parsed) => {
              const errMsg = parsed.error || parsed.message || 'Unknown error';
              showToast('错误: ' + errMsg, 'error');
              if (state.currentStreamMsgId) {
                const msg = getCurrentSession()?.messages.find(m => m.id === state.currentStreamMsgId);
                if (msg) {
                  msg.content += '\n\n**错误**: ' + errMsg;
                  msg.isStreaming = false;
                  updateAssistantMessage(msg.id, msg.content, false);
                  saveSessionMessages(state.currentSessionId); saveStorage();
                }
                state.currentStreamMsgId = null;
              }
              state.isSending = false;
              updateSendBtn();
            },
            onQuestion: (parsed) => {
              const requestID = parsed.requestID || parsed.request_id || parsed.id;
              if (requestID && !state.currentQuestion) {
                state.currentQuestion = {
                  requestID,
                  question: parsed.question || parsed.message || '请选择:',
                  type: parsed.type || 'text',
                  options: parsed.options || [],
                };
              }
            },
          });
        }
      } catch (err) {
        console.warn('[Send] Error:', err.message);
        showToast('发送失败: ' + err.message, 'error');
        state.isSending = false;
        updateSendBtn();
        setStatus('connected', '已连接');
      }
    }

    function updateSendBtn() {
      const hasText = dom.msgInput.value.trim().length > 0;
      dom.sendBtn.classList.toggle('active', hasText && !state.isSending);
      dom.sendBtn.disabled = !hasText || state.isSending;
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Question Handling
    // ═══════════════════════════════════════════════════════════════
    async function pollQuestions() {
      if (!state.currentSessionId) return;

      try {
        const questions = await apiJson('/api/question');
        if (questions && questions.length > 0) {
          const q = questions[0];
          const requestID = q.requestID || q.request_id || q.id;
          if (requestID && !state.currentQuestion) {
            state.currentQuestion = {
              requestID: requestID,
              question: q.question || q.message || '请选择:',
              type: q.type || 'text',
              options: q.options || [],
            };
            showQuestionModal();
          }
        }
      } catch (err) {
        // Silently ignore poll errors
      }
    }

    function showQuestionModal() {
      if (!state.currentQuestion) return;

      const q = state.currentQuestion;
      dom.modalQuestion.textContent = q.question;
      dom.modalOptions.innerHTML = '';
      dom.modalInput.value = '';

      if (q.options && q.options.length > 0) {
        dom.modalOptions.style.display = 'flex';
        dom.modalInput.style.display = 'none';

        q.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'modal-option';
          btn.textContent = typeof opt === 'string' ? opt : (opt.label || opt.text || String(opt));
          btn.addEventListener('click', () => {
            dom.modalOptions.querySelectorAll('.modal-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            dom.modalInput.value = btn.textContent;
          });
          dom.modalOptions.appendChild(btn);
        });
      } else {
        dom.modalOptions.style.display = 'none';
        dom.modalInput.style.display = '';
        dom.modalInput.focus();
      }

      dom.modalOverlay.classList.add('open');
    }

    function hideQuestionModal() {
      dom.modalOverlay.classList.remove('open');
      state.currentQuestion = null;
    }

    async function answerQuestion() {
      if (!state.currentQuestion) return;

      const answer = dom.modalInput.value.trim();
      if (!answer) {
        showToast('请输入或选择一个回答', 'info');
        return;
      }

      const requestID = state.currentQuestion.requestID;
      dom.modalSend.disabled = true;

      try {
        await apiFetch('/api/question/' + encodeURIComponent(requestID) + '/reply', {
          method: 'POST',
          body: JSON.stringify({ answer: answer }),
        });
        hideQuestionModal();
        showToast('回答已发送', 'success');
      } catch (err) {
        showToast('发送回答失败: ' + err.message, 'error');
      } finally {
        dom.modalSend.disabled = false;
      }
    }

    function skipQuestion() {
      hideQuestionModal();
      showToast('已跳过提问', 'info');
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Event Listeners
    // ═══════════════════════════════════════════════════════════════
    function setupListeners() {
      // Send button
      dom.sendBtn.addEventListener('click', sendMessage);

      // Input: Enter to send
      dom.msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Input: update send button state
      dom.msgInput.addEventListener('input', updateSendBtn);

      // Menu button: open sidebar
      dom.menuBtn.addEventListener('click', openSidebar);

      // Sidebar close
      dom.sidebarClose.addEventListener('click', closeSidebar);
      dom.sidebarOverlay.addEventListener('click', closeSidebar);

      // New session
      dom.newSessionBtn.addEventListener('click', handleNewSession);

      // Retry button
      dom.retryBtn.addEventListener('click', () => {
        location.reload();
      });

      // Question modal
      dom.modalSend.addEventListener('click', answerQuestion);
      dom.modalCancel.addEventListener('click', skipQuestion);

      // ── Settings ──
      dom.settingsBtn.addEventListener('click', showSettings);
      dom.settingsCloseBtn.addEventListener('click', hideSettings);
      dom.settingsOverlay.addEventListener('click', (e) => {
        if (e.target === dom.settingsOverlay) hideSettings();
      });
      dom.settingsChangeBtn.addEventListener('click', handleSettingsChange);
      dom.settingsSaveBtn.addEventListener('click', handleSettingsSave);

      // ── Password visibility toggles ──
      dom.setupPwToggle.addEventListener('click', () => togglePasswordVisibility(dom.setupPassword, dom.setupPwToggle));
      dom.setupConfirmToggle.addEventListener('click', () => togglePasswordVisibility(dom.setupConfirm, dom.setupConfirmToggle));
      dom.settingsPwToggle.addEventListener('click', () => togglePasswordVisibility(dom.settingsPassword, dom.settingsPwToggle));
      dom.settingsConfirmToggle.addEventListener('click', () => togglePasswordVisibility(dom.settingsConfirm, dom.settingsConfirmToggle));

      // ── Setup page ──
      dom.setupSaveBtn.addEventListener('click', handleSetupSave);
      dom.setupRestartBtn.addEventListener('click', () => { location.reload(); });

      // Enter key on password fields triggers save
      dom.setupPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSetupSave(); });
      dom.setupConfirm.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSetupSave(); });
      dom.settingsPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSettingsSave(); });
      dom.settingsConfirm.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSettingsSave(); });

      // ── Login ──
      dom.loginBtn.addEventListener('click', handleLogin);
      dom.loginPwToggle.addEventListener('click', () => togglePasswordVisibility(dom.loginPassword, dom.loginPwToggle));
      dom.loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });

      // Visual viewport resize (mobile keyboard)
      if (visualViewport) {
        let lastVh = visualViewport.height;
        visualViewport.addEventListener('resize', () => {
          const vh = visualViewport.height;
          // Wait for keyboard animation
          clearTimeout(window._viewportTimer);
          window._viewportTimer = setTimeout(() => {
            scrollToBottom();
          }, 100);
          lastVh = vh;
        });
      }

      // Window resize
      window.addEventListener('resize', () => {
        scrollToBottom();
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Password Setup & Settings
    // ═══════════════════════════════════════════════════════════════

    // SVG icons for password visibility toggle
    const EYE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_OFF_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    function togglePasswordVisibility(input, btn) {
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = isPassword ? EYE_OFF_SVG : EYE_SVG;
    }

    // Check if Relay needs password setup (calls setup endpoint directly,
    // without auth header or directory param — the server handles these
    // endpoints before the auth middleware)
    async function checkSetupStatus() {
      try {
        const res = await fetch('/api/setup/status');
        if (!res.ok) return true;
        const data = await res.json();
        return data.configured === true;
      } catch {
        return true;
      }
    }

    function showSetupPage() {
      dom.setupPage.style.display = '';
      dom.app.style.display = 'none';
      hideOverlay();
    }

    function resetSetupPage() {
      dom.setupFields.style.display = '';
      dom.setupSuccess.style.display = 'none';
      dom.setupPassword.value = '';
      dom.setupConfirm.value = '';
      dom.setupError.style.display = 'none';
      dom.setupSaveBtn.disabled = false;
      dom.setupBtnText.style.display = '';
      dom.setupSpinner.style.display = 'none';
      dom.setupPassword.type = 'password';
      dom.setupConfirm.type = 'password';
      dom.setupPwToggle.innerHTML = EYE_SVG;
      dom.setupConfirmToggle.innerHTML = EYE_SVG;
    }

    // Shared save logic for both setup page and settings modal
    async function savePassword(password, confirm, errorEl, formEl, successEl, btnEl, spinnerEl, textEl) {
      const pwd = password ? password.trim() : '';
      const cfm = confirm ? confirm.trim() : '';

      if (pwd.length < 4) {
        errorEl.textContent = '密码至少需要4位字符';
        errorEl.style.display = '';
        return;
      }
      if (pwd !== cfm) {
        errorEl.textContent = '两次输入的密码不一致';
        errorEl.style.display = '';
        return;
      }
      errorEl.style.display = 'none';

      btnEl.disabled = true;
      textEl.style.display = 'none';
      spinnerEl.style.display = '';

      try {
        const res = await fetch('/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd }),
        });
        const data = await res.json();

        if (data.ok) {
          formEl.style.display = 'none';
          successEl.style.display = '';
        } else {
          const errMap = { password_min_length: '密码至少需要4位字符', invalid_json: '请求数据格式错误' };
          errorEl.textContent = errMap[data.error] || data.error || '保存失败';
          errorEl.style.display = '';
          btnEl.disabled = false;
          textEl.style.display = '';
          spinnerEl.style.display = 'none';
        }
      } catch (err) {
        errorEl.textContent = '网络错误，无法保存密码';
        errorEl.style.display = '';
        btnEl.disabled = false;
        textEl.style.display = '';
        spinnerEl.style.display = 'none';
      }
    }

    function handleSetupSave() {
      savePassword(
        dom.setupPassword.value,
        dom.setupConfirm.value,
        dom.setupError,
        dom.setupFields,
        dom.setupSuccess,
        dom.setupSaveBtn,
        dom.setupSpinner,
        dom.setupBtnText
      );
    }

    // ── Settings modal ─────────────────────────────────────────

    function showSettings() {
      dom.settingsMain.style.display = '';
      dom.settingsForm.style.display = 'none';
      dom.settingsSuccess.style.display = 'none';
      dom.settingsPassword.value = '';
      dom.settingsConfirm.value = '';
      dom.settingsError.style.display = 'none';
      dom.settingsSaveBtn.disabled = false;
      dom.settingsBtnText.style.display = '';
      dom.settingsSpinner.style.display = 'none';
      dom.settingsPassword.type = 'password';
      dom.settingsConfirm.type = 'password';
      dom.settingsPwToggle.innerHTML = EYE_SVG;
      dom.settingsConfirmToggle.innerHTML = EYE_SVG;
      dom.settingsOverlay.classList.add('open');
    }

    function hideSettings() {
      dom.settingsOverlay.classList.remove('open');
    }

    function handleSettingsChange() {
      dom.settingsMain.style.display = 'none';
      dom.settingsForm.style.display = '';
      dom.settingsPassword.focus();
    }

    function handleSettingsSave() {
      savePassword(
        dom.settingsPassword.value,
        dom.settingsConfirm.value,
        dom.settingsError,
        dom.settingsForm,
        dom.settingsSuccess,
        dom.settingsSaveBtn,
        dom.settingsSpinner,
        dom.settingsBtnText
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Initialization
    // ═══════════════════════════════════════════════════════════════
    async function init() {
      cacheDom();
      setupListeners();

      // 1. Extract and store token (URL param → sessionStorage)
      if (!initToken()) {
        showLoginPage();
        return;
      }

      // 2. Check if Relay needs password setup
      const configured = await checkSetupStatus();
      if (!configured) {
        showSetupPage();
        return;
      }

      // Show settings gear button
      dom.settingsBtn.style.display = '';

      // 3. Ensure we have a session
      try {
        await ensureSession();
      } catch (err) {
        return;
      }

      const cur = getCurrentSession();
      if (cur) {
        dom.sessionIndicator.textContent = cur.title ? cur.title.slice(0, 30) : '';
      }

      // 3. Mark as connected (SSE is per-message, not persistent)
      setStatus('connected', '已连接');

      // 4. Start question polling
      setInterval(pollQuestions, QUESTION_POLL_INTERVAL);

      // 6. Hide overlay with a small delay for smooth transition
      setTimeout(() => {
        hideOverlay();
      }, 500);

      console.log('OpenCode Relay v2 — Chat Interface');
    }

    // ═══════════════════════════════════════════════════════════════
    // ─── Boot
    // ═══════════════════════════════════════════════════════════════
    // Wait for DOM and CDN scripts
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
