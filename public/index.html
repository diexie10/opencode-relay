          <div class="sp-title">关于</div>
          <div class="about-box">
            <div class="ab-logo" dangerouslySetInnerHTML=${raw(ICONS.logo)} />
            <div class="ab-name">OpenCode Relay</div>
            <div class="ab-ver">v2.0 SoftGlass</div>
            <div class="ab-desc">基于 OpenCode 的远程对话中继服务，支持多模型、多代理、实时流式回复。</div>
          </div>
        </div>

        <button class="logout-btn" onClick=${handleLogout}>退出登录</button>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   QuestionModal — handles agent questions (choice or text)
   ═══════════════════════════════════════════════════════════════════ */
function QuestionModal() {
  useBump();
  const [answer, setAnswer] = useState('');
  const [selected, setSelected] = useState(null);

  if (!state.currentQuestion) return null;
  const q = state.currentQuestion;
  const isChoice = q.options && q.options.length > 0;

  function handleSend() {
    const val = isChoice ? (selected || '') : answer.trim();
    if (!val) { showToast('请输入或选择一个回答', 'info'); return; }
    answerQuestion(val);
    setAnswer(''); setSelected(null);
  }

  async function handleReject() {
    try {
      await apiFetch('/api/question/' + encodeURIComponent(q.requestID) + '/reject', { method: 'POST' });
    } catch (e) { /* ignore */ }
    state.currentQuestion = null;
    bump();
  }

  return html`
    <div class="modal-overlay open">
      <div class="modal-card">
        <div class="modal-icon" dangerouslySetInnerHTML=${raw(ICONS.alert)} />
        <div class="modal-question">${q.question}</div>
        ${isChoice ? html`
          <div class="modal-options">
            ${q.options.map(opt => html`
              <button class=${'modal-option' + (selected === opt ? ' selected' : '')}
                onClick=${() => setSelected(opt)}>${opt}</button>
            `)}
          </div>
        ` : html`
          <textarea class="modal-input" placeholder="输入你的回答..." rows="3"
            value=${answer} onInput=${e => setAnswer(e.target.value)}
            onKeyDown=${e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) handleSend(); }} />
        `}
        <div class="modal-actions">
          <button class="cancel" onClick=${handleReject}>取消</button>
          <button class="send" disabled=${isChoice ? !selected : !answer.trim()} onClick=${handleSend}>发送</button>
        </div>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   ToastContainer
   ═══════════════════════════════════════════════════════════════════ */
function ToastContainer() {
  useBump();
  if (state.toasts.length === 0) return null;
  return html`
    <div class="toast-container">
      ${state.toasts.map(t => html`
        <div class=${'toast ' + (t.type || 'info')}>
          ${t.type === 'success' ? html`<span dangerouslySetInnerHTML=${raw(ICONS.checkCircle)} />` :
            t.type === 'error' ? html`<span dangerouslySetInnerHTML=${raw(ICONS.alert)} />` :
            html`<span dangerouslySetInnerHTML=${raw(ICONS.info)} />`}
          <span>${t.msg}</span>
        </div>
      `)}
    </div>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   App — root component (routes based on authState)
   ═══════════════════════════════════════════════════════════════════ */
function App() {
  useBump();

  if (state.authState === 'loading') {
    return html`
      <div class="overlay">
        <div class="spinner"></div>
        <div class="overlay-msg">${state.status.label}</div>
      </div>
    `;
  }

  if (state.authState === 'setup' || state.authState === 'login') {
    return html`<${AuthPage} mode=${state.authState} onSuccess=${initApp} />`;
  }

  return html`
    <${Fragment}>
      <div class="ambient">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
      </div>
      <${NavBar} />
      <${ChatArea} />
      <${InputBar} />
      <${Sidebar} />
      <${SettingsPanel} />
      <${QuestionModal} />
      <${ToastContainer} />
    <//>
  `;
}

/* ═══════════════════════════════════════════════════════════════════
   Initialization — called after auth or on page load
   ═══════════════════════════════════════════════════════════════════ */
async function initApp() {
  state.authState = 'loading';
  state.status = { type: 'connecting', label: '初始化...' };
  bump();

  // 1. Fetch capabilities (models, agents, variants)
  try {
    const caps = await apiJson('/api/models', { skipDirectory: true });
    if (caps.models) _allModels = caps.models;
    if (caps.agents) _allAgents = caps.agents;
    if (caps.variants) _allVariants = caps.variants;
    if (caps.defaultModel) {
      state.sessionConfig.model = caps.defaultModel;
    } else if (caps.models && caps.models.length > 0) {
      state.sessionConfig.model = { id: caps.models[0].id, providerID: caps.models[0].providerID };
    }
    if (caps.defaultAgent) state.sessionConfig.agent = caps.defaultAgent;
    if (caps.defaultVariant) state.sessionConfig.variant = caps.defaultVariant;
  } catch (e) {
    console.warn('[Init] Failed to fetch capabilities:', e.message);
  }

  // 2. Set fixed mobile workspace + fetch import candidates
  try {
    const [ws, scanned, imported] = await Promise.all([
      apiJson('/api/workspace', { skipDirectory: true }),
      apiJson('/api/scan-directories', { skipDirectory: true }).catch(() => []),
      listImportedProjects().catch(() => []),
    ]);
    _currentDirectory = ws.path || '';
    _desktopDirs = Array.isArray(scanned) ? scanned : [];
    _importedProjects = Array.isArray(imported) ? imported : [];
    console.log('[Init] Workspace:', _currentDirectory);
    console.log('[Init] Desktop dirs for import:', _desktopDirs.length);
    console.log('[Init] Imported projects:', _importedProjects.length);
  } catch (e) {
    console.warn('[Init] Failed to fetch workspace:', e.message);
  }

  // 3. Ensure we have a session
  try {
    await ensureSession();
  } catch (err) {
    state.status = { type: 'error', label: '不可用' };
    state.authState = 'ready';
    bump();
    return;
  }

  // 4. Connected
  state.authState = 'ready';
  state.status = { type: 'connected', label: '已连接' };
  bump();

  // 5. Connect global event stream
  connectGlobalEventStream();

  // 6. Start question polling (fallback)
  setInterval(pollQuestions, QUESTION_POLL_INTERVAL);
}

/* ═══════════════════════════════════════════════════════════════════
   Boot — extract token, check setup, init app
   ═══════════════════════════════════════════════════════════════════ */
async function boot() {
  // 1. Extract token from URL or sessionStorage
  const params = new URLSearchParams(location.search);
  const t = params.get('token');
  if (t) {
    state.token = t;
    sessionStorage.setItem('ocr_token', t);
    history.replaceState(null, '', location.pathname + location.hash);
  } else {
    state.token = sessionStorage.getItem('ocr_token');
  }

  // 2. No token — check setup status, show login or setup page
  if (!state.token) {
    try {
      const res = await fetch('/api/setup/status');
      const data = await res.json();
      state.authState = data.configured ? 'login' : 'setup';
    } catch {
      state.authState = 'login';
    }
    bump();
    return;
  }

  // 3. Has token — verify setup is still configured
  try {
    const res = await fetch('/api/setup/status');
    const data = await res.json();
    if (!data.configured) {
      state.authState = 'setup';
      bump();
      return;
    }
  } catch {}

  // 4. Initialize the app
  await initApp();
}

// ── Render & Boot ──────────────────────────────────────────────────
// Load saved theme before first render to avoid flash of default colors
loadTheme();
render(html`<${App} />`, document.getElementById('app'));

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
