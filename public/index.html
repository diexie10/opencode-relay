<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="referrer" content="no-referrer">
  <title>OpenCode Relay</title>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <style>
    /* ── CSS Variables ─────────────────────────────────────────── */
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface-elevated: #1e1e1e;
      --border: #2a2a2a;
      --accent: #f5a623;
      --accent-dim: rgba(245,166,35,0.15);
      --text: #e8e8e8;
      --text-secondary: #a0a0a0;
      --text-muted: #666;
      --user-bg: #1a3355;
      --user-border: #234572;
      --success: #4caf50;
      --warning: #ff9800;
      --error: #ef5350;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --header-h: 48px;
      --sidebar-w: 290px;
    }

    /* ── Reset ─────────────────────────────────────────────────── */
    *,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    html,body {
      height:100%;
      width:100%;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* ── App Shell ─────────────────────────────────────────────── */
    #app {
      display:flex;
      flex-direction:column;
      height:100%;
      height:100dvh;
      width:100%;
      position:relative;
      max-width:720px;
      margin:0 auto;
      border-left:1px solid var(--border);
      border-right:1px solid var(--border);
      overscroll-behavior:none;
    }

    @media (max-width:720px) {
      #app { border:none; }
    }

    /* ── Scrollbar ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#333; border-radius:2px; }

    /* ── Overlay (loading) ─────────────────────────────────────── */
    .overlay {
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      z-index:200;
      gap:20px;
      padding:32px;
      text-align:center;
      transition:opacity 0.4s ease, visibility 0.4s ease;
    }
    .overlay.hidden { opacity:0; visibility:hidden; pointer-events:none; }

    .spinner {
      width:28px;
      height:28px;
      border:2.5px solid var(--border);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .overlay-title {
      font-size:18px;
      font-weight:700;
      color:var(--text);
      letter-spacing:-0.3px;
    }
    .overlay-msg {
      font-size:13px;
      color:var(--text-muted);
      line-height:1.5;
      margin-top:-8px;
    }
    .overlay-msg.error { color:var(--error); }

    .retry-btn {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:10px;
      color:var(--text);
      padding:10px 32px;
      font-size:14px;
      font-weight:500;
      cursor:pointer;
      margin-top:4px;
      transition:background 0.15s;
      font-family:inherit;
    }
    .retry-btn:active { background:var(--border); }

    /* ── Header ───────────────────────────────────────────────── */
    .header {
      display:flex;
      align-items:center;
      height:var(--header-h);
      padding:0 8px;
      padding-top:var(--safe-top);
      background:var(--surface);
      border-bottom:1px solid var(--border);
      flex-shrink:0;
      z-index:20;
      gap:4px;
    }

    .menu-btn {
      width:36px;height:36px;
      display:flex;align-items:center;justify-content:center;
      background:none;border:none;color:var(--text-secondary);
      font-size:20px;cursor:pointer;border-radius:8px;
      flex-shrink:0;transition:color 0.15s,background 0.15s;
    }
    .menu-btn:active { color:var(--text); background:var(--border); }

    .header-title {
      font-size:15px;font-weight:600;color:var(--text);
      letter-spacing:-0.2px;white-space:nowrap;flex-shrink:0;
    }

    .header-spacer { flex:1; min-width:8px; }

    .session-indicator {
      flex:0 1 auto;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:12px;
      color:var(--text-muted);
      padding:0 8px;
      text-align:center;
      min-width:0;
    }

    .status-indicator {
      display:flex;
      align-items:center;
      gap:6px;
      flex-shrink:0;
      padding:0 4px;
    }

    .status-dot {
      width:7px;height:7px;
      border-radius:50%;
      background:var(--text-muted);
      transition:background 0.3s, box-shadow 0.3s;
      flex-shrink:0;
    }
    .status-dot.connected { background:var(--success); box-shadow:0 0 8px rgba(76,175,80,0.5); }
    .status-dot.reconnecting { background:var(--warning); box-shadow:0 0 8px rgba(255,152,0,0.4); animation:pulse 1.2s ease-in-out infinite; }
    .status-dot.error { background:var(--error); }

    @keyframes pulse {
      0%,100% { opacity:1; }
      50% { opacity:0.4; }
    }

    .status-label {
      font-size:11px;
      color:var(--text-muted);
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }

    /* ── Chat Container ────────────────────────────────────────── */
    #chat-container {
      flex:1;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      padding:12px 12px 4px;
      display:flex;
      flex-direction:column;
    }

    #chat-messages {
      margin-top:auto;
      display:flex;
      flex-direction:column;
      gap:6px;
      width:100%;
    }

    #chat-messages:empty::after {
      content:'发送消息开始对话';
      display:block;
      text-align:center;
      color:var(--text-muted);
      font-size:13px;
      padding:40px 20px;
      margin-top:40vh;
    }

    .chat-date {
      text-align:center;
      font-size:11px;
      color:var(--text-muted);
      padding:12px 0 4px;
    }

    /* ── Message Bubbles ──────────────────────────────────────── */
    .msg {
      display:flex;
      flex-direction:column;
      max-width:88%;
      animation:fadeIn 0.2s ease-out;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

    .msg.user {
      align-self:flex-end;
      align-items:flex-end;
    }
    .msg.assistant {
      align-self:flex-start;
      align-items:flex-start;
    }
    .msg.tool {
      align-self:flex-start;
      align-items:flex-start;
      max-width:100%;
      width:100%;
    }

    .msg-bubble {
      padding:10px 14px;
      border-radius:16px;
      font-size:15px;
      line-height:1.5;
      word-break:break-word;
      overflow-wrap:break-word;
      position:relative;
    }

    .msg.user .msg-bubble {
      background:var(--user-bg);
      border:1px solid var(--user-border);
      color:var(--text);
      border-bottom-right-radius:4px;
    }

    .msg.assistant .msg-bubble {
      background:var(--surface-elevated);
      border:1px solid var(--border);
      color:var(--text);
      border-bottom-left-radius:4px;
    }

    .msg.tool .msg-bubble {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:10px;
      padding:0;
      overflow:hidden;
      width:100%;
    }

    .msg-role {
      font-size:11px;
      color:var(--text-muted);
      padding:0 4px 2px;
    }

    /* ── Tool Call ────────────────────────────────────────────── */
    .tool-header {
      display:flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      cursor:pointer;
      user-select:none;
      -webkit-user-select:none;
      font-size:13px;
      color:var(--text-secondary);
      font-family:"SF Mono","JetBrains Mono","Fira Code",Menlo,monospace;
      transition:background 0.15s;
    }
    .tool-header:active { background:var(--surface-elevated); }

    .tool-icon { font-size:14px; flex-shrink:0; }
    .tool-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tool-arrow { font-size:10px; transition:transform 0.2s; color:var(--text-muted); }
    .tool-arrow.open { transform:rotate(90deg); }

    .tool-body {
      display:none;
      padding:8px 12px 12px;
      background:var(--bg);
      border-top:1px solid var(--border);
      font-size:13px;
      line-height:1.45;
      color:var(--text-secondary);
      font-family:"SF Mono","JetBrains Mono","Fira Code",Menlo,monospace;
      white-space:pre-wrap;
      word-break:break-all;
      max-height:400px;
      overflow-y:auto;
    }
    .tool-body.open { display:block; }

    /* ── Streaming Cursor ─────────────────────────────────────── */
    .streaming-cursor::after {
      content:'▊';
      display:inline;
      animation:blink 0.8s step-end infinite;
      color:var(--accent);
      font-size:14px;
      margin-left:1px;
    }
    @keyframes blink { 50% { opacity:0; } }

    /* ── Markdown Content ───────────────────────────────────── */
    .msg-bubble h1 { font-size:18px; font-weight:600; margin:8px 0 4px; }
    .msg-bubble h2 { font-size:16px; font-weight:600; margin:8px 0 4px; }
    .msg-bubble h3 { font-size:14px; font-weight:600; margin:6px 0 3px; }
    .msg-bubble p { margin:4px 0; }
    .msg-bubble p:first-child { margin-top:0; }
    .msg-bubble p:last-child { margin-bottom:0; }
    .msg-bubble ul, .msg-bubble ol { margin:4px 0; padding-left:20px; }
    .msg-bubble li { margin:2px 0; }
    .msg-bubble blockquote {
      border-left:3px solid var(--accent);
      padding:4px 12px;
      margin:6px 0;
      color:var(--text-secondary);
      background:rgba(255,255,255,0.03);
      border-radius:0 4px 4px 0;
    }
    .msg-bubble code {
      background:rgba(255,255,255,0.07);
      padding:1px 6px;
      border-radius:4px;
      font-size:13px;
      font-family:"SF Mono","JetBrains Mono","Fira Code",Menlo,monospace;
      color:var(--accent);
    }
    .msg-bubble pre {
      margin:8px 0;
      border-radius:8px;
      overflow:hidden;
      background:#111;
      border:1px solid var(--border);
    }
    .msg-bubble pre code {
      display:block;
      overflow-x:auto;
      padding:12px 14px;
      background:transparent;
      color:var(--text-secondary);
      font-size:12px;
      line-height:1.45;
      border-radius:0;
    }
    .msg-bubble a {
      color:var(--accent);
      text-decoration:none;
      border-bottom:1px solid var(--accent-dim);
    }
    .msg-bubble a:active { opacity:0.7; }
    .msg-bubble hr { border:none; border-top:1px solid var(--border); margin:10px 0; }
    .msg-bubble table {
      border-collapse:collapse;
      margin:6px 0;
      font-size:13px;
      width:100%;
    }
    .msg-bubble th, .msg-bubble td {
      border:1px solid var(--border);
      padding:6px 10px;
      text-align:left;
    }
    .msg-bubble th { background:var(--surface); font-weight:600; }
    .msg-bubble img { max-width:100%; border-radius:8px; margin:4px 0; }

    /* ── Input Bar ────────────────────────────────────────────── */
    .input-bar {
      flex-shrink:0;
      padding:8px 10px;
      padding-bottom:calc(8px + var(--safe-bottom));
      background:var(--surface);
      border-top:1px solid var(--border);
      display:flex;
      gap:8px;
      align-items:flex-end;
    }

    .input-wrap {
      flex:1;
      display:flex;
      align-items:center;
      background:var(--bg);
      border:1px solid var(--border);
      border-radius:12px;
      transition:border-color 0.2s, box-shadow 0.2s;
      overflow:hidden;
      min-height:42px;
    }
    .input-wrap:focus-within {
      border-color:var(--accent);
      box-shadow:0 0 0 2px var(--accent-dim);
    }

    #msg-input {
      flex:1;
      background:none;
      border:none;
      color:var(--text);
      font-size:16px;
      padding:10px 14px;
      outline:none;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
      min-width:0;
      line-height:1.4;
    }
    #msg-input::placeholder { color:#444; }

    .send-btn {
      width:42px;
      height:42px;
      background:var(--accent);
      border:none;
      border-radius:12px;
      color:#000;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      touch-action:manipulation;
      transition:opacity 0.15s, transform 0.1s;
      opacity:0.35;
    }
    .send-btn.active { opacity:1; }
    .send-btn:active { transform:scale(0.9); }
    .send-btn:disabled { opacity:0.2; cursor:default; }

    .send-btn svg { width:20px; height:20px; }

    /* ── Sidebar ──────────────────────────────────────────────── */
    .sidebar-overlay {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.5);
      z-index:100;
      opacity:0;
      visibility:hidden;
      transition:opacity 0.3s ease, visibility 0.3s ease;
    }
    .sidebar-overlay.open { opacity:1; visibility:visible; }

    .sidebar {
      position:fixed;
      top:0;
      left:0;
      bottom:0;
      width:var(--sidebar-w);
      max-width:85vw;
      background:var(--surface);
      border-right:1px solid var(--border);
      z-index:110;
      display:flex;
      flex-direction:column;
      transform:translateX(-100%);
      transition:transform 0.3s cubic-bezier(0.22,1,0.36,1);
      padding-top:var(--safe-top);
    }
    .sidebar.open { transform:translateX(0); }

    .sidebar-header {
      display:flex;
      align-items:center;
      padding:12px 16px;
      border-bottom:1px solid var(--border);
      flex-shrink:0;
    }
    .sidebar-header-title {
      font-size:15px;
      font-weight:600;
      flex:1;
    }
    .sidebar-close {
      width:32px;height:32px;
      display:flex;align-items:center;justify-content:center;
      background:none;border:none;
      color:var(--text-muted);
      font-size:16px;
      cursor:pointer;
      border-radius:6px;
    }
    .sidebar-close:active { background:var(--border); }

    .sidebar-body {
      flex:1;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding:8px;
    }

    .session-item {
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:10px;
      cursor:pointer;
      transition:background 0.15s;
      margin-bottom:2px;
    }
    .session-item:active { background:var(--surface-elevated); }
    .session-item.active {
      background:var(--accent-dim);
      border:1px solid rgba(245,166,35,0.2);
    }

    .session-item-icon {
      width:32px;height:32px;
      display:flex;align-items:center;justify-content:center;
      background:var(--bg);
      border-radius:8px;
      flex-shrink:0;
      font-size:14px;
      color:var(--text-muted);
    }
    .session-item.active .session-item-icon {
      background:var(--accent-dim);
      color:var(--accent);
    }

    .session-item-info {
      flex:1;
      min-width:0;
    }
    .session-item-title {
      font-size:13px;
      font-weight:500;
      color:var(--text);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .session-item-meta {
      font-size:11px;
      color:var(--text-muted);
      margin-top:2px;
    }

    .session-item-delete {
      width:28px;height:28px;
      display:flex;align-items:center;justify-content:center;
      background:none;border:none;
      color:var(--text-muted);
      font-size:14px;
      cursor:pointer;
      border-radius:6px;
      opacity:0;
      transition:opacity 0.15s;
      flex-shrink:0;
    }
    .session-item:hover .session-item-delete,
    .session-item:active .session-item-delete { opacity:1; }
    .session-item-delete:active { color:var(--error); background:rgba(239,83,80,0.15); }

    .sidebar-footer {
      padding:8px;
      border-top:1px solid var(--border);
      flex-shrink:0;
    }

    .new-session-btn {
      width:100%;
      padding:10px;
      background:var(--surface-elevated);
      border:1px dashed var(--border);
      border-radius:10px;
      color:var(--text-secondary);
      font-size:13px;
      font-weight:500;
      cursor:pointer;
      font-family:inherit;
      transition:background 0.15s, border-color 0.15s, color 0.15s;
    }
    .new-session-btn:active {
      background:var(--border);
      border-color:var(--text-muted);
      color:var(--text);
    }

    .sidebar-version {
      text-align:center;
      font-size:10px;
      color:var(--text-muted);
      padding:8px;
      opacity:0.5;
    }

    /* ── Question Modal ───────────────────────────────────────── */
    .modal-overlay {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.6);
      z-index:150;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      opacity:0;
      visibility:hidden;
      transition:opacity 0.25s ease, visibility 0.25s ease;
    }
    .modal-overlay.open { opacity:1; visibility:visible; }

    .modal-card {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:16px;
      width:100%;
      max-width:380px;
      max-height:80vh;
      display:flex;
      flex-direction:column;
      box-shadow:0 20px 60px rgba(0,0,0,0.5);
      transform:scale(0.95) translateY(10px);
      transition:transform 0.25s cubic-bezier(0.22,1,0.36,1);
    }
    .modal-overlay.open .modal-card { transform:scale(1) translateY(0); }

    .modal-header {
      display:flex;
      align-items:center;
      gap:10px;
      padding:16px 20px 12px;
      border-bottom:1px solid var(--border);
    }
    .modal-icon { font-size:20px; }
    .modal-title { font-size:15px; font-weight:600; }

    .modal-body {
      padding:16px 20px;
      overflow-y:auto;
      flex:1;
    }
    .modal-question {
      font-size:14px;
      line-height:1.5;
      color:var(--text-secondary);
      margin-bottom:12px;
    }

    .modal-options {
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-bottom:12px;
    }
    .modal-option {
      padding:10px 14px;
      background:var(--bg);
      border:1px solid var(--border);
      border-radius:10px;
      color:var(--text);
      font-size:14px;
      cursor:pointer;
      text-align:left;
      font-family:inherit;
      transition:background 0.15s, border-color 0.15s;
    }
    .modal-option:active {
      background:var(--surface-elevated);
      border-color:var(--accent);
    }
    .modal-option.selected {
      border-color:var(--accent);
      background:var(--accent-dim);
    }

    .modal-input {
      width:100%;
      min-height:80px;
      padding:10px 14px;
      background:var(--bg);
      border:1px solid var(--border);
      border-radius:10px;
      color:var(--text);
      font-size:14px;
      font-family:inherit;
      resize:vertical;
      outline:none;
      transition:border-color 0.2s;
      line-height:1.5;
    }
    .modal-input:focus { border-color:var(--accent); }
    .modal-input::placeholder { color:#444; }

    .modal-footer {
      display:flex;
      gap:8px;
      padding:12px 20px 16px;
      border-top:1px solid var(--border);
    }

    .modal-btn {
      flex:1;
      padding:10px;
      border-radius:10px;
      font-size:14px;
      font-weight:500;
      cursor:pointer;
      font-family:inherit;
      border:1px solid var(--border);
      transition:background 0.15s, opacity 0.15s;
    }
    .modal-btn-cancel {
      background:transparent;
      color:var(--text-muted);
      border-color:var(--border);
    }
    .modal-btn-cancel:active { background:var(--surface-elevated); }

    .modal-btn-send {
      background:var(--accent);
      color:#000;
      border-color:var(--accent);
    }
    .modal-btn-send:active { opacity:0.85; }
    .modal-btn-send:disabled { opacity:0.3; cursor:default; }

    /* ── Toast ─────────────────────────────────────────────────── */
    .toast-container {
      position:fixed;
      top:calc(var(--safe-top) + 8px);
      left:50%;
      transform:translateX(-50%);
      z-index:300;
      display:flex;
      flex-direction:column;
      gap:6px;
      align-items:center;
      pointer-events:none;
      width:auto;
      max-width:90vw;
    }

    .toast {
      padding:10px 18px;
      border-radius:10px;
      font-size:13px;
      font-weight:500;
      color:#fff;
      background:var(--surface-elevated);
      border:1px solid var(--border);
      box-shadow:0 8px 24px rgba(0,0,0,0.4);
      pointer-events:auto;
      animation:toastIn 0.25s ease-out;
      max-width:100%;
      text-align:center;
      line-height:1.4;
    }
    .toast.info { border-color:var(--accent); }
    .toast.error { border-color:var(--error); background:rgba(239,83,80,0.2); }
    .toast.success { border-color:var(--success); background:rgba(76,175,80,0.15); }

    @keyframes toastIn {
      from { opacity:0; transform:translateY(-12px); }
      to { opacity:1; transform:translateY(0); }
    }

    .toast.removing {
      animation:toastOut 0.2s ease-in forwards;
    }
    @keyframes toastOut {
      to { opacity:0; transform:translateY(-12px); }
    }

    /* ── Landscape ─────────────────────────────────────────────── */
    @media (orientation:landscape) and (max-height:500px) {
      .header { height:36px; }
      .header-title { font-size:13px; }
      .input-bar { padding:4px 8px; padding-bottom:calc(4px + var(--safe-bottom)); }
      .input-wrap { min-height:36px; }
      #msg-input { padding:7px 12px; font-size:15px; }
      .send-btn { width:36px; height:36px; }
    }

    /* ── Setup Page ──────────────────────────────────────────── */
    #setup-page {
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;

    .setup-desc {
      font-size:13px;color:var(--text-muted);
      line-height:1.5;margin-bottom:28px;
    }
    .setup-field { margin-bottom:16px; }
    .setup-label {
      display:block;font-size:12px;font-weight:500;
      color:var(--text-secondary);margin-bottom:6px;
    }
    .password-wrap {
      display:flex;align-items:center;
      background:var(--bg);border:1px solid var(--border);
      border-radius:12px;overflow:hidden;
      transition:border-color 0.2s,box-shadow 0.2s;
    }
    .password-wrap:focus-within {
      border-color:var(--accent);
      box-shadow:0 0 0 2px var(--accent-dim);
    }
    .setup-input {
      flex:1;background:none;border:none;
      color:var(--text);font-size:15px;
      padding:12px 14px;outline:none;
      font-family:inherit;min-width:0;
    }
    .setup-input::placeholder { color:#444; }
    .pw-toggle {
      width:40px;height:40px;
      display:flex;align-items:center;justify-content:center;
      background:none;border:none;color:var(--text-muted);
      cursor:pointer;flex-shrink:0;transition:color 0.15s;
    }
    .pw-toggle:active { color:var(--text); }
    .pw-toggle svg { width:18px;height:18px; }
    .setup-error {
      display:none;
      font-size:13px;color:var(--error);
      padding:8px 12px;background:rgba(239,83,80,0.1);
      border-radius:8px;margin-bottom:16px;line-height:1.4;
    }
    .setup-btn {
      width:100%;padding:12px;

    .setup-success { text-align:center;padding:12px 0; display:none; }
    .setup-success-msg {
      font-size:15px;color:var(--success);

    }
    /* ── Settings ────────────────────────────────────────────── */

    .settings-change-btn {

      cursor:pointer;font-family:inherit;transition:background 0.15s;
    }
    .settings-change-btn:active { background:var(--border); }
    .settings-note {
      font-size:12px;color:var(--text-muted);margin-top:12px;line-height:1.4;
      padding:8px 12px;background:rgba(255,152,0,0.08);
      border-radius:8px;border:1px solid rgba(255,152,0,0.15);
    }
    .settings-form { margin-top:16px; border-top:1px solid var(--border); padding-top:16px; }

    /* ── Login Page ──────────────────────────────────────────── */
    #login-page {
      position:fixed;inset:0;
      display:flex;align-items:center;justify-content:center;
      background:var(--bg);z-index:190;

    .login-input {

</head>
<body>
  <!-- Overlay (loading) -->
  <div class="overlay" id="overlay">
    <div class="spinner" id="overlay-spinner"></div>
    <div class="overlay-title">OpenCode Relay</div>
    <div class="overlay-msg" id="overlay-msg">连接中...</div>
    <button class="retry-btn" id="retry-btn" style="display:none">重试</button>
  </div>

  <!-- App Container -->
  <div id="app">
    <!-- Header -->
    <header class="header">
      <button class="menu-btn" id="menu-btn" aria-label="菜单">☰</button>
      <button class="menu-btn" id="settings-btn" aria-label="设置" style="display:none">⚙</button>
      <span class="header-title">OpenCode</span>

        <div class="status-dot" id="status-dot"></div>

    <!-- Chat -->

    <!-- Input Bar -->
    <div class="input-bar">

          id="msg-input"
          type="text"
          placeholder="输入消息..."
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="send"
          disabled
        >
      </div>
      <button class="send-btn" id="send-btn" disabled aria-label="发送">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>

  </div>

  <!-- Sidebar -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-header-title">历史会话</span>

    <div class="sidebar-footer">
      <button class="new-session-btn" id="new-session-btn">＋ 新建会话</button>

  <!-- Question Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-icon">❓</span>
        <span class="modal-title">OpenCode 提问</span>
      </div>
      <div class="modal-body" id="modal-body">
        <div class="modal-question" id="modal-question"></div>
        <div class="modal-options" id="modal-options"></div>

      </div>

      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Setup Page -->
  <div id="setup-page" style="display:none">
    <div class="setup-card">
      <h1 class="setup-title">设置密码</h1>
      <p class="setup-desc">设置 Relay 访问密码，重启后生效</p>
      <div id="setup-fields">
        <div class="setup-field">
          <label class="setup-label">密码</label>
          <div class="password-wrap">
            <input class="setup-input" id="setup-password" type="password" placeholder="输入密码（至少4位）" autocomplete="new-password">
            <button class="pw-toggle" id="setup-pw-toggle" type="button" aria-label="显示密码">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>

            <button class="pw-toggle" id="setup-confirm-toggle" type="button" aria-label="显示密码">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>

      <div class="setup-success" id="setup-success">
        <div class="setup-success-msg">密码已保存！请重启 Relay</div>
        <button class="setup-btn" id="setup-restart-btn">重启 Relay</button>
      </div>
    </div>
  </div>

  <!-- Login Page -->
  <div id="login-page" style="display:none">
    <div class="login-card">
      <h1 class="login-title">登录 Relay</h1>
      <p class="login-desc">输入密码以访问 OpenCode Relay</p>
      <div class="login-field">
        <label class="login-label">密码</label>
        <div class="password-wrap">
          <input class="login-input" id="login-password" type="password" placeholder="输入密码" autocomplete="current-password">
          <button class="pw-toggle" id="login-pw-toggle" type="button" aria-label="显示密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>

      </div>
      <div class="login-error" id="login-error"></div>
      <button class="login-btn" id="login-btn">
        <span id="login-btn-text">登录</span>
